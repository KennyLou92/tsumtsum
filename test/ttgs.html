<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Tsum Tsum 抽卡模擬器</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #121212;
      color: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    #banner {
      width: 500px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .draw-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
    }

    .draw-btn {
      background-color: transparent;
      border: none;
      color: #f5f5f5;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s;
    }

    .draw-btn:hover {
      transform: scale(1.05);
    }

    .draw-btn img {
      width: 50px;
      height: 50px;
    }

    #resultContainer {
      margin-top: 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .tsum {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background-color: #1e1e1e;
      box-shadow: 0 0 6px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .tsum img {
      width: 100%;
    }
  </style>
</head>
<body>
 <!-- <h1>Tsum Tsum 抽卡模擬器</h1> -->
  <img id="banner" src="" alt="Box Banner">

  <div class="draw-buttons">
    <button id="singleDrawBtn" class="draw-btn">
      <img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png" alt="coin"> 單抽 30,000
    </button>
    <button id="multiDrawBtn" class="draw-btn">
      <img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png" alt="coin"> 10 連抽 300,000
    </button>
  </div>

  <div id="resultContainer"></div>

  <!-- 外部載入 JS -->
  <script src="selectbox.js"></script>
  <script src="tsum.js"></script>
  <script src="images.js"></script>

  <script>
    // 🔹 重新整理時清除紀錄
    window.addEventListener("beforeunload", () => {
      localStorage.removeItem("tsumResults");
    });

    const resultContainer = document.getElementById("resultContainer");
    const singleDrawBtn = document.getElementById("singleDrawBtn");
    const multiDrawBtn = document.getElementById("multiDrawBtn");
    const banner = document.getElementById("banner");

    const boxData = selectbox.find(b => b.box === "novbox");
    if (!boxData) {
      console.error("找不到 novbox");
    } else {
      banner.src = boxData.box_label;
    }

    let results = JSON.parse(localStorage.getItem("tsumResults")) || [];
    results.forEach(showTsum);

    singleDrawBtn.addEventListener("click", () => draw(1));
    multiDrawBtn.addEventListener("click", () => draw(10));

    function draw(count) {
      if (!boxData) return;

      for (let i = 0; i < count; i++) {
        const tsumId = boxData.box_tsum[Math.floor(Math.random() * boxData.box_tsum.length)];
        const tsumInfo = tsumData.find(t => t.id === tsumId);
        if (!tsumInfo) {
          console.error(`找不到 tsum id: ${tsumId}`);
          continue;
        }

        const tsumImg = images[tsumInfo.image];
        if (!tsumImg) {
          console.error(`找不到圖片: ${tsumInfo.image}`);
          continue;
        }

        const newResult = { id: tsumId, image: tsumImg };
        results.push(newResult);

        // 只保留最後 30 個
        if (results.length > 30) {
          results = results.slice(results.length - 30);
        }

        showTsum(newResult);
      }

      localStorage.setItem("tsumResults", JSON.stringify(results));
    }

    function showTsum(result) {
      const tsumDiv = document.createElement("div");
      tsumDiv.className = "tsum";

      const img = document.createElement("img");
      img.src = result.image;
      tsumDiv.appendChild(img);

      resultContainer.appendChild(tsumDiv);

      // 超過 30 個就刪除舊的
      while (resultContainer.children.length > 30) {
        resultContainer.removeChild(resultContainer.firstChild);
      }
    }
  </script>
</body>
</html>
