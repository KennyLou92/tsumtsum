<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>祖母模擬抽抽抽！！</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{ --bg:#0f0f10; --panel:#151516; --muted:#9aa0a6; --accent:#ffd54f; --card:#1e1e1e }
  body{background:var(--bg);color:#fff;font-family:Segoe UI, Roboto, \"Microsoft JhengHei\",sans-serif;padding:18px;text-align:center}
  .panel{max-width:980px;margin:12px auto;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  h1{margin:6px 0 12px 0;font-size:20px}
  #banner{width:90%;max-width:650px;border-radius:10px;margin:6px auto;display:block;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
  .top-row{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .slv-box{background:linear-gradient(180deg,#141414,#1b1b1b);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);font-size:14px}
  .draw-row{margin-top:14px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
  .draw-btn{background:#222;border:1px solid rgba(255,255,255,0.03);color:#fff;padding:10px 18px;border-radius:10px;font-size:16px;cursor:pointer;min-width:120px}
  .draw-btn:hover{transform:translateY(-3px)}
  #stats{margin-top:10px;color:var(--muted);font-size:14px}
  #results{margin-top:18px;display:grid;grid-template-columns:repeat(10, 1fr);gap:8px;justify-items:center;align-items:center;max-width:980px;margin-left:auto;margin-right:auto}
  .tsum{width:86px;height:86px;border-radius:10px;background-image:url("https://i.postimg.cc/wBpXSbwN/win-list-panel-off.png");background-size:cover;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,0.6)}
  .tsum img{width:68px;height:68px;object-fit:contain;border-radius:8px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:99;display:none}
  #overlay .box{background:#111;padding:28px;border-radius:12px;border:2px solid rgba(255,255,255,0.05);font-size:26px}
  .small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
  <div class="panel">
<!--    <h1>TsumTsum 抽卡模擬器（有機率 / SLv）</h1> -->

    <img id="banner" src="" alt="box banner">

    <div class="top-row">
      <div class="slv-box" id="slv623">623 SLv: 0</div>
      <div class="slv-box" id="slv620">620 SLv: 0</div>
      <div class="slv-box" id="slv622">622 SLv: 0</div>
    </div>

    <div class="draw-row">
      <button class="draw-btn" id="singleBtn">單抽</button>
      <button class="draw-btn" id="multiBtn">10連抽</button>
    </div>

    <div id="stats" class="small">
      已抽次數：<span id="totalDraws">0</span> &nbsp;•&nbsp; 已使用金幣：<span id="totalCoins">0</span>
      <div style="margin-top:6px" id="probSummary"></div>
    </div>

    <div id="results" aria-live="polite" aria-atomic="true"></div>
  </div>

  <div id="overlay"><div class="box">敬請期待</div></div>

  <!-- 外部資料（請放在同目錄） -->
  <script src="selectbox.js"></script>
  <script src="tsum.js"></script>
  <script src="images.js"></script>

  <script>
/* ======== 設定區 ======== */
const SINGLE_COST = 30000;
const MULTI_COST = 300000;
const DISPLAY_LIMIT = 30;
const DISPLAY_COLUMNS = 10;

/* ======== 資料來源檢查 ======== */
if (typeof selectbox === 'undefined' || typeof tsumData === 'undefined' || typeof images === 'undefined') {
  alert('未正確載入 selectbox.js / tsum.js / images.js，請檢查檔名與變數。');
  throw new Error('missing data files');
}

/* 取 novbox（只使用 novbox） */
const box = selectbox.find(b => b.box === 'novbox');
if (!box) { alert('selectbox 中找不到 novbox'); throw new Error('novbox not found'); }

/* 建立 id -> tsum 物件 map（方便查詢） */
const tsumMap = new Map();
for (const t of tsumData) {
  tsumMap.set(Number(t.id), t);
}

/* 建立 box 內有效 tsum id 列表（只採用在 tsumMap 中有定義的） */
let poolIds = box.box_tsum.map(id => Number(id)).filter(id => tsumMap.has(id));

/* ======== 權重初始設定（raw） ========
   使用你給的指定比率：623:2%, 620:8%, 622:7%，其餘預設 0.61%（接著 normalize 到總和 100%）
*/
const RAW = {};
const SPEC = {623:2, 620:8, 622:7};
for (const id of poolIds) {
  if (SPEC[id] !== undefined) RAW[id] = SPEC[id];
  else RAW[id] = 0.61;
}
/* normalize: scale so sum == 100 */
(function normalizeRaw() {
  const total = Object.values(RAW).reduce((s,v)=>s+v,0);
  const factor = 100 / total;
  for (const k of Object.keys(RAW)) RAW[k] = RAW[k] * factor;
})();

/* activeWeights 會隨 SLv6 發生改變（到 SLv6 的 tsum 權重會變為 0，餘下重新 normalize） */
let activeWeights = {...RAW};

function recomputeActiveWeights() {
  // activeWeights already has zeros for locked tsums
  const sum = Object.values(activeWeights).reduce((s,v)=>s+v,0);
  if (sum <= 0) return; // all zero，後面會觸發結束
  const factor = 100 / sum;
  for (const k of Object.keys(activeWeights)) activeWeights[k] = activeWeights[k] * factor;
}

/* ======== SLv 與獲得計數管理 ======== */
/* 用來記錄每個 tsum 已獲得的「片數/次數」 */
const obtained = {}; // id -> count (整數)

/* helper: 由 skill_cost 陣列計算累計門檻陣列（索引0代表升到SLv1所需總數） */
function cumulativeThresholds(skill_cost) {
  if (!Array.isArray(skill_cost)) return [1,2,4,8,16,32]; // fallback
  const out = [];
  let s = 0;
  for (let v of skill_cost) { s += Number(v) || 0; out.push(s); }
  return out;
}

/* 取得目前 SLv（0..6） */
function getSLv(id) {
  const t = tsumMap.get(Number(id));
  if (!t) return 0;
  const costArr = cumulativeThresholds(t.skill_cost || t.skillCost || t.skillcost);
  const cnt = obtained[id] || 0;
  let slv = 0;
  for (let i=0;i<costArr.length;i++){
    if (cnt >= costArr[i]) slv = i+1;
    else break;
  }
  return Math.min(slv,6);
}

/* 當第一次獲得 623 時給予初始 SLv3（以累計門檻做補足） */
function handleFirstSpecialFor623(id) {
  if (Number(id) !== 623) return;
  if ((obtained[623] || 0) > 0) return; // 已有過，不再補
  const t = tsumMap.get(623);
  if (!t) return;
  const thr = cumulativeThresholds(t.skill_cost);
  // SLv3 對應的累計門檻 index 2
  const requiredForSL3 = thr[2] || (thr.length>=3 ? thr[2] : 3);
  obtained[623] = requiredForSL3;
}

/* 檢查是否所有 poolIds 都達到 SLv6 */
function allPoolMaxed() {
  return poolIds.every(id => getSLv(id) >= 6);
}

/* ======== 抽卡機率邏輯（加權隨機） ======== */
function pickWeightedId() {
  // 準備 active list（只包含 weight>0 且仍在 poolIds）
  const items = [];
  for (const id of poolIds) {
    const w = activeWeights[id] || 0;
    if (w > 0) items.push({id, w});
  }
  if (items.length === 0) return null;
  // cumulative
  const total = items.reduce((s,it)=>s+it.w,0);
  let r = Math.random() * total;
  for (const it of items) {
    if (r < it.w) return it.id;
    r -= it.w;
  }
  return items[items.length-1].id;
}

/* ======== UI state ======== */
const bannerEl = document.getElementById('banner');
const slvEl = {623: document.getElementById('slv623'), 620: document.getElementById('slv620'), 622: document.getElementById('slv622')};
const singleBtn = document.getElementById('singleBtn');
const multiBtn = document.getElementById('multiBtn');
const totalDrawsEl = document.getElementById('totalDraws');
const totalCoinsEl = document.getElementById('totalCoins');
const resultsEl = document.getElementById('results');
const overlay = document.getElementById('overlay');
const probSummaryEl = document.getElementById('probSummary');

/* 初始化 */
bannerEl.src = box.box_label || '';
let totalDraws = 0;
let totalCoins = 0;
let results = []; // 陣列保存 image src（oldest -> newest）

/* 顯示權重摘要（小數點兩位） */
function renderProbSummary() {
  // show main three plus others count
  const w623 = (activeWeights[623]||0).toFixed(2);
  const w620 = (activeWeights[620]||0).toFixed(2);
  const w622 = (activeWeights[622]||0).toFixed(2);
  const othersCount = poolIds.filter(id => id!==623 && id!==620 && id!==622).length;
  probSummaryEl.textContent = `機率（%）：623 ${w623} ／ 620 ${w620} ／ 622 ${w622} ／ 其他 ${othersCount} 個（合計 100%）`;
}

/* 更新按鈕上方 SLv 顯示 */
function refreshSLvDisplay() {
  slvEl[623].textContent = `623 SLv: ${getSLv(623)}`;
  slvEl[620].textContent = `620 SLv: ${getSLv(620)}`;
  slvEl[622].textContent = `622 SLv: ${getSLv(622)}`;
}

/* 更新結果面板（最舊 -> 最新） */
function refreshResultsPanel() {
  resultsEl.innerHTML = '';
  // 保證 results 最多 DISPLAY_LIMIT 個，且順序 oldest -> newest（results 陣列維持此順序）
  const visible = results.slice(-DISPLAY_LIMIT);
  for (const src of visible) {
    const div = document.createElement('div');
    div.className = 'tsum';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    div.appendChild(img);
    resultsEl.appendChild(div);
  }
}

/* 更新統計文字 */
function refreshStats() {
  totalDrawsEl.textContent = totalDraws;
  totalCoinsEl.textContent = totalCoins.toLocaleString();
}

/* 當某個 tsum 達成 SLv6 時處理：權重歸零並重新 normalize */
function handleSlv6IfHit(id) {
  if (getSLv(id) >= 6) {
    activeWeights[id] = 0;
    recomputeActiveWeights();
  }
}

/* 每次抽到要呼叫的流程（count 次） */
function performDraws(count) {
  if (allPoolMaxed()) {
    showOverlay();
    return;
  }

  for (let i=0;i<count;i++){
    const id = pickWeightedId();
    if (id === null) {
      // 沒有可抽的（全部 weight 0）
      showOverlay();
      break;
    }

    // handle special 623 first-time
    if ((obtained[id] || 0) === 0 && id === 623) {
      handleFirstSpecialFor623(623);
      // note: we treat this as "first obtain granted" but still record this draw as an event as well below
    }

    // 增加一次獲得數（若 special 已將 623 設成多個片數，先前的補足不代表已經算過抽卡次數，這裡仍把本次抽卡算入）
    obtained[id] = (obtained[id] || 0) + 1;

    // 顯示圖像：從 tsumMap 找 image 名，再從 images 取得 (images 可為 data: 或 url)
    const t = tsumMap.get(id);
    let imgSrc = null;
    if (t && t.image && images[t.image]) imgSrc = images[t.image];
    else {
      // fallback：沒圖時用 placeholder
      imgSrc = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="50%" fill="#999" font-size="10" text-anchor="middle" dominant-baseline="middle">no image</text></svg>`);
    }

    // 新的結果放最後（oldest->newest）
    results.push(imgSrc);
    if (results.length > DISPLAY_LIMIT) results = results.slice(-DISPLAY_LIMIT);

    // 檢查是否剛達成 SLv6（或已經達成）
    handleSlv6IfHit(id);

    // 若某顆達 SLv6，且造成所有達 SLv6，則終止並顯示 overlay
    if (allPoolMaxed()) {
      showOverlay();
      break;
    }
  }

  // 計數與金幣
  totalDraws += count;
  totalCoins += (count === 10 ? MULTI_COST : SINGLE_COST);

  // 更新 UI
  refreshSLvDisplay();
  refreshResultsPanel();
  refreshStats();
  renderProbSummary();
}

/* overlay（全滿時） */
function showOverlay() {
  overlay.style.display = 'flex';
  singleBtn.disabled = true;
  multiBtn.disabled = true;
}

/* 綁定事件 */
singleBtn.addEventListener('click', () => performDraws(1));
multiBtn.addEventListener('click', () => performDraws(10));

/* 初始 render */
recomputeActiveWeights();
renderProbSummary();
refreshSLvDisplay();
refreshResultsPanel();
refreshStats();

/* (選擇性) 將目前 weights 列到 console，方便 debug */
console.log('initial RAW weights', RAW);
console.log('initial activeWeights', activeWeights);

/* 若你希望把狀態存到 localStorage 可自行加，但目前依你需求 F5 不保留 */
  </script>
</body>
</html>
