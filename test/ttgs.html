<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsum Tsum模擬抽！</title>
<style>
  body {
    background-color: #121212;
    color: #fff;
    font-family: "Segoe UI", sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  #banner {
    width: 600px;
    margin: 20px auto;
    border-radius: 10px;
    display: block;
  }
  #specials {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .special {
    background: url("https://i.postimg.cc/wBpXSbwN/win-list-panel-off.png") no-repeat center/contain;
    width: 120px;
    height: 120px;
    position: relative;
  }
  .special img {
    width: 80px;
    height: 80px;
    margin-top: 15px;
  }
  .slv {
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    text-align: center;
    font-weight: bold;
    color: #ffd700;
  }
  #buttons {
    margin: 20px;
  }
  button {
    background: none;
    border: none;
    cursor: pointer;
    margin: 0 10px;
  }
  button img {
    width: 80px;
    height: 80px;
  }
  #stats {
    margin: 10px;
    font-size: 18px;
  }
  #results {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
    width: 90%;
  }
  .result {
    background: url("https://i.postimg.cc/wBpXSbwN/win-list-panel-off.png") no-repeat center/contain;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result img {
    width: 70%;
    height: 70%;
  }
  #message {
    font-size: 20px;
    color: #ffcc00;
    margin-top: 20px;
  }
</style>
</head>
<body>

<img id="banner" src="" alt="Box Banner">
<div id="specials"></div>

<div id="buttons">
  <button id="singleDraw"><img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png"><br>單抽</button>
  <button id="tenDraw"><img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png"><br>10連抽</button>
</div>

<div id="stats">
  抽數: <span id="totalDraws">0</span>　
  消費金幣: <span id="totalCoins">0</span>
</div>

<div id="results"></div>
<div id="message"></div>

<script src="selectbox.js"></script>
<script src="tsum.js"></script>
<script src="image.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const box = selectBoxes.find(b => b.box === "novbox");
  const tsumList = box.box_tsum;
  const banner = document.getElementById("banner");
  const resultsDiv = document.getElementById("results");
  const specialsDiv = document.getElementById("specials");
  const messageDiv = document.getElementById("message");
  const totalDrawsEl = document.getElementById("totalDraws");
  const totalCoinsEl = document.getElementById("totalCoins");

  banner.src = box.box_label;

  const slvData = {}; // { id: {count, slv} }
  let totalDraws = 0;
  let totalCoins = 0;

  const rateMap = {
    623: 2,
    620: 8,
    622: 7
  };
  const baseOthers = (100 - 2 - 8 - 7) / (tsumList.length - 3);

  const pool = tsumList.map(id => ({
    id,
    rate: rateMap[id] || baseOthers
  }));

  function getSkillCostSum(tsumId) {
    const t = tsumData.find(x => x.id === tsumId);
    return t ? t.skill_cost.reduce((a,b)=>a+b,0) : 999;
  }

  function drawOne() {
    if (pool.length === 0) {
      messageDiv.textContent = "敬請期待";
      return;
    }

    const roll = Math.random() * 100;
    let acc = 0;
    let chosen = pool[pool.length-1].id;
    for (const p of pool) {
      acc += p.rate;
      if (roll < acc) {
        chosen = p.id;
        break;
      }
    }

    if (!slvData[chosen]) {
      const is623 = (chosen === 623);
      slvData[chosen] = { count: is623 ? 3 : 0, slv: is623 ? 3 : 0 };
    } else {
      slvData[chosen].count++;
      const tsum = tsumData.find(t => t.id === chosen);
      const cost = tsum.skill_cost;
      let sum = 0, level = 0;
      for (let i = 0; i < cost.length; i++) {
        sum += cost[i];
        if (slvData[chosen].count >= sum) level = i + 1;
      }
      slvData[chosen].slv = Math.min(level, 6);
    }

    if (slvData[chosen].slv >= 6) {
      const idx = pool.findIndex(p => p.id === chosen);
      if (idx >= 0) pool.splice(idx, 1);
      const remainRate = pool.reduce((a,b)=>a+b.rate,0);
      for (const p of pool) p.rate = p.rate / remainRate * 100;
    }

    totalDraws++;
    totalCoins += 30000;
    totalDrawsEl.textContent = totalDraws;
    totalCoinsEl.textContent = totalCoins.toLocaleString();

    const tsum = tsumData.find(t => t.id === chosen);
    const imgSrc = images[tsum.image];
    const div = document.createElement("div");
    div.className = "result";
    const img = document.createElement("img");
    img.src = imgSrc;
    div.appendChild(img);
    resultsDiv.appendChild(div);

    const allResults = Array.from(resultsDiv.children);
    if (allResults.length > 30) resultsDiv.removeChild(allResults[0]);

    updateSpecials();
  }

  function updateSpecials() {
    specialsDiv.innerHTML = "";
    [623,620,622].forEach(id => {
      const tsum = tsumData.find(t => t.id === id);
      const imgSrc = images[tsum.image];
      const div = document.createElement("div");
      div.className = "special";
      const img = document.createElement("img");
      img.src = imgSrc;
      const slv = document.createElement("div");
      slv.className = "slv";
      const slvInfo = slvData[id]?.slv || 0;
      slv.textContent = "SLv" + slvInfo;
      div.appendChild(img);
      div.appendChild(slv);
      specialsDiv.appendChild(div);
    });
  }

  document.getElementById("singleDraw").onclick = () => drawOne();
  document.getElementById("tenDraw").onclick = () => {
    for (let i = 0; i < 10; i++) drawOne();
  };
});
</script>
</body>
</html>
