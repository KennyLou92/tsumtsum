<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎵TsumTsum圖鑑</title>
  <script src="window-bg.js"></script>
  <script>
    try {
      if (localStorage.getItem("tsumTheme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --panel: #ffffff;
      --panel-hover: #fbf7ec;
      --line: #ddd6c8;
      --text: #2a2a2a;
      --muted: #777;
      --accent: #c27a00;
      --bar: rgba(246, 243, 238, 0.95);
      --input-bg: #fff;
      --input-text: #222;
      --input-line: #ccc;
      --overlay: rgba(0, 0, 0, 0.5);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #222;
      --panel: #2c2c2c;
      --panel-hover: #363636;
      --line: #4a4a4a;
      --text: #eee;
      --muted: #aaa;
      --accent: #ffd34d;
      --bar: rgba(34, 34, 34, 0.95);
      --input-bg: #fff;
      --input-text: #000;
      --input-line: #ccc;
      --overlay: rgba(0, 0, 0, 0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- 搜尋列 ---------- */
    #search-container {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    #search {
      width: 300px;
      max-width: 100%;
      padding: 10px;
      font-size: 16px;
      color: var(--input-text);
      background: var(--input-bg);
      border: 1px solid var(--input-line);
    }
    /* ---------- 分類泡泡（Series / Tsum Type） ---------- */
    #filterPanel {
      padding: 8px 20px 0;
      display: none;
    }
    #filterPanel.show { display: block; }
    .fgroup {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .fgroup-label {
      flex: none;
      width: 62px;
      padding-top: 3px;
      font-size: 11px;
      font-weight: bold;
      color: var(--muted);
    }
    .chips {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 56px;          /* 收合時約 2 行 */
      overflow: hidden;
    }
    .fgroup.expanded .chips { max-height: none; }
    .chip {
      padding: 2px 8px;
      font: inherit;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 99px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip .n { margin-left: 3px; font-size: 10px; color: var(--muted); }
    .chip:hover { border-color: var(--accent); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #222; font-weight: bold; }
    .chip.on .n { color: #444; }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .fmore, #fclear {
      flex: none;
      padding: 2px 6px;
      font: inherit;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
    }
    .fmore:hover, #fclear:hover { color: var(--accent); }
    .fmore[hidden] { display: none; }
    #fclear { display: block; margin: 0 0 4px 70px; padding-left: 0; }
    #fclear[hidden] { display: none; }

    #langRow { margin: 0 0 6px; text-align: right; }
    #langRow[hidden] { display: none; }
    #langBtn {
      padding: 2px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.5;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    #langBtn:hover:not(:disabled) { border-color: var(--accent); }
    #langBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #langBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #regionBtn {
      margin-left: auto;
      min-width: 52px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    #regionBtn:hover:not(:disabled) { border-color: var(--accent); }
    #regionBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #regionBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #themeBtn {
      margin-left: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    #themeBtn:hover { border-color: var(--accent); }
    #themeBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #clearSearchBtn {
      width: 35px;
      height: 35px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #clearSearchBtn:hover { opacity: 1; }

    /* ---------- Tsum 方格 ---------- */
    #tsumGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      padding: 20px;
    }
    .tsum-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tsum-card:hover { background: var(--panel-hover); border-color: var(--accent); }
    .tsum-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tsum-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .tsum-card .no {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .tsum-card .name {
      margin-top: 2px;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      word-break: break-word;
    }
    .tsum-card .no-img {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
    }
    #emptyMsg {
      display: none;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- 詳細視窗 ---------- */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--overlay);
    }
    #modal.open { display: flex; }
    .modal-box {
      position: relative;
      /* 固定圖片比例 601:752，寬度不超過原圖，也不超出螢幕高度，背景圖不會被拉伸 */
      width: min(601px, 100%, calc((100vh - 32px) * 601 / 752));
      width: min(601px, 100%, calc((100dvh - 32px) * 601 / 752));
      aspect-ratio: 601 / 752;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
      /* 視窗背景圖：不加底色、邊框與圓角，完全使用圖片本身的外形 */
      background: var(--window-bg-img, none) center / 100% 100% no-repeat;
      border: none;
      border-radius: 0;
      /* 內部尺寸用 cqw（視窗寬度的 1%），視窗縮放時文字與留白會跟著等比例縮放 */
      container-type: inline-size;
      /* 上方白色標題帶：深色文字 */
      --text: #3a2a1a;
      --muted: #6a5a48;
      --accent: #ffd34d;
      color: var(--text);
    }
    /* 標題：對齊背景圖上方的白色標題帶 */
    .modal-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 2.5cqw;
      margin-top: 12.6cqw;
      height: 9.8cqw;
      padding: 0 9cqw;
      line-height: 1.15;
    }
    .modal-head img {
      width: 8.6cqw;
      height: 8.6cqw;
      object-fit: contain;
    }
    .modal-head .no { font-size: max(9px, 2.1cqw); color: var(--muted); }
    .modal-head .name { font-size: max(12px, 3.4cqw); font-weight: bold; }
    .modal-head .name-en { font-size: max(9px, 2.1cqw); color: var(--muted); }

    /* 內容：位在深藍色區域，改用淺色文字；內容過多時只捲動這一塊 */
    .modal-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin: 0 3.5cqw 13.5cqw;
      padding: 0 5.5cqw;
      --text: #ffffff;
      --muted: #cfe3ff;
      --accent: #ffd34d;
      --line: rgba(255, 255, 255, 0.2);
      color: var(--text);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }
    /* 系列 / Tsum 類型：顯示在 skill label 上方，沒有資料時不佔位置 */
    .modal-info {
      margin: 2.5cqw 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2cqw;
      text-align: center;
    }
    .modal-info:empty { display: none; }
    .info-series {
      font-size: max(11px, 2.5cqw);
      font-weight: bold;
      color: var(--accent);
    }
    .info-series .k { margin-right: 1cqw; font-weight: normal; color: var(--muted); }
    .info-types {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1cqw;
    }
    .info-type {
      padding: 0.4cqw 1.8cqw;
      font-size: max(10px, 2.1cqw);
      color: var(--text);
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 99px;
      white-space: nowrap;
    }
    /* skill label 置中；Plus 圖章在它的下方 */
    .modal-label {
      --label-h: 15cqw;      /* skill label 的高度（以原圖為準） */
      margin: 3cqw 0 2cqw;
      min-height: var(--label-h);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .modal-label .none { color: var(--muted); }
    .label-img {
      display: block;
      max-width: 100%;
      width: calc(var(--w) * var(--ks) * 1cqw);
      height: auto;
    }

    /* Plus 圖章：圖片會先裁掉四周透明邊再顯示，所以大小只要調整 --plus-scale：
       數字越大圖章與文字越大（每 1 像素的原圖 = 幾 cqw）。
       一隻 Tsum 有多組圖章時，每組（圖章＋文字）左右並排置中；
       一行放不下時不會換行，而是整體等比例縮小。
       沒有 Plus 資料時這一塊不佔位置。 */
    .modal-plus {
      --plus-scale: 0.12;
      margin: 0 0 2cqw;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 3cqw;
    }
    .modal-plus:empty { display: none; }
    .plus-item {
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 1cqw;
    }
    .plus-item img {
      flex: 0 1 auto;
      min-width: 0;
      display: block;
      width: calc(var(--w) * var(--plus-scale) * 1cqw);
      height: auto;
    }

    .skill-list { margin: 0; padding: 0; list-style: none; }
    .skill-row {
      display: grid;
      grid-template-columns: 9cqw 1fr auto;
      gap: 1.5cqw;
      align-items: center;
      padding: 1.6cqw 0;
      font-size: max(12px, 2.6cqw);
      border-top: 1px solid var(--line);
    }
    .skill-row:first-child { border-top: none; }
    .skill-row .lv {
      font-weight: bold;
      color: var(--accent);
    }
    .skill-row .desc { line-height: 1.5; }
    .skill-icon {
      height: 4.6cqw;
      vertical-align: middle;
    }
    .cost {
      display: flex;
      align-items: center;
      gap: 0.7cqw;
      white-space: nowrap;
    }
    .cost img { height: 4cqw; }
    .skill-empty { padding: 16px 0; text-align: center; color: var(--muted); }

    /* ---------- 捲動按鈕 ---------- */
    .scroll-button {
      position: fixed;
      right: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      opacity: 0.1;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .scroll-button:hover { opacity: 1; }
    #scrollTopBtn { bottom: 80px; }
    #scrollBottomBtn { bottom: 20px; }
  </style>
</head>
<body>
  <div id="search-container">
    <input type="text" id="search" placeholder="🔍 輸入Tsum名稱..." />
    <img id="clearSearchBtn" src="https://i.postimg.cc/6pVSz87S/win-batsu-s.png" alt="Clear" />
    <button type="button" id="regionBtn"></button>
    <button type="button" id="themeBtn"></button>
  </div>

  <div id="filterPanel">
    <div id="langRow"><button type="button" id="langBtn"></button></div>
    <div class="fgroup" id="seriesGroup">
      <div class="fgroup-label">Series</div>
      <div class="chips" id="seriesChips"></div>
      <button type="button" class="fmore" data-for="seriesGroup">展開 ▾</button>
    </div>
    <div class="fgroup" id="typeGroup">
      <div class="fgroup-label">Tsum Type</div>
      <div class="chips" id="typeChips"></div>
      <button type="button" class="fmore" data-for="typeGroup">展開 ▾</button>
    </div>
    <button type="button" id="fclear" hidden>✕ 清除分類</button>
  </div>

  <div id="tsumGrid"></div>
  <div id="emptyMsg">找不到符合的 Tsum</div>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <img id="scrollTopBtn" class="scroll-button" src="https://i.postimg.cc/RZRdN8b6/win-arrow-up.png" alt="Top" />
  <img id="scrollBottomBtn" class="scroll-button" src="https://i.postimg.cc/MGpDRDhs/win-arrow-down.png" alt="Bottom" />

  <script src="tsum.js"></script>
  <script src="tsum_en.js"></script>
  <script src="tsum_jp.js"></script>
  <script src="images.js"></script>
  <script src="skilllabel.js"></script>
  <script src="skilllabeljp.js"></script>
  <script src="skilllabelen.js"></script>
  <script src="littletsum.js"></script>
  <script src="pluspin.js"></script>

  <script>
    // ---------- 介面文字（GL 切到 EN 時使用英文） ----------
    const I18N = {
      tw: { placeholder: "🔍 輸入Tsum名稱...", empty: "找不到符合的 Tsum", series: "系列",
            more: "展開 ▾", less: "收合 ▴", clear: "✕ 清除分類", none: "暫無",
            noSkill: "暫無技能資料", skillAlt: "技能" },
      en: { placeholder: "🔍 Search Tsum name...", empty: "No matching Tsum found", series: "Series",
            more: "Expand ▾", less: "Collapse ▴", clear: "✕ Clear filters", none: "N/A",
            noSkill: "No skill data", skillAlt: "Skill" },
      jp: { placeholder: "🔍 ツムの名前を入力...", empty: "該当するツムが見つかりません", series: "シリーズ",
            more: "展開 ▾", less: "折りたたむ ▴", clear: "✕ 絞り込みを解除", none: "なし",
            noSkill: "スキルデータなし", skillAlt: "スキル" }
    };
    let uiLang = "tw";
    const ui = () => I18N[uiLang];

    const imageMap = images;
    const pinMap = typeof wappen !== "undefined" ? wappen : {};
    const TICKET_IMG = "https://i.postimg.cc/nzcz0QBq/win-i-ticket-S.png";
    const iconMap = {};
    const grid = document.getElementById("tsumGrid");
    const emptyMsg = document.getElementById("emptyMsg");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearchBtn");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");

    (window.littletsumData || []).forEach(item => {
      const key = Object.keys(item)[0];
      iconMap[key] = item[key];
    });

    // ---------- 工具 ----------
    const esc = s => String(s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const escRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const iconKeys = Object.keys(iconMap)
      .filter(k => k && imageMap[iconMap[k]])
      .sort((a, b) => b.length - a.length);
    const iconRegex = iconKeys.length
      ? new RegExp("(" + iconKeys.map(escRegex).join("|") + ")", "g")
      : null;

    // 技能說明：文字跳脫、圖示代碼換成圖片、換行轉 <br>
    function parseDesc(raw) {
      const html = iconRegex
        ? raw.split(iconRegex).map((part, i) =>
            i % 2 === 1
              ? `<img src="${imageMap[iconMap[part]]}" class="skill-icon" alt="">`
              : esc(part)
          ).join("")
        : esc(raw);
      return html.replace(/\n/g, "<br>");
    }

    function getImageNames(tsum) {
      return Array.isArray(tsum.image)
        ? tsum.image
        : String(tsum.image || "").split(",").map(s => s.trim());
    }

    const padNo = id => String(id ?? "").padStart(3, "0");

    // ---------- 方格 ----------
    function render(data) {
      grid.innerHTML = "";
      emptyMsg.style.display = data.length ? "none" : "block";

      data.forEach(tsum => {
        const imageNames = getImageNames(tsum);
        let imageIndex = 0;

        const card = document.createElement("button");
        card.type = "button";
        card.className = "tsum-card";

        if (imageMap[imageNames[0]]) {
          const img = document.createElement("img");
          img.src = imageMap[imageNames[0]];
          img.alt = tsum.name || "";
          card.appendChild(img);

          // 多張圖：滑過時輪播
          if (imageNames.length > 1) {
            let intervalId = null;
            card.addEventListener("mouseenter", () => {
              intervalId = setInterval(() => {
                imageIndex = (imageIndex + 1) % imageNames.length;
                const next = imageMap[imageNames[imageIndex]];
                if (next) img.src = next;
              }, 500);
            });
            card.addEventListener("mouseleave", () => {
              clearInterval(intervalId);
              imageIndex = 0;
              img.src = imageMap[imageNames[0]];
            });
          }
        } else {
          const ph = document.createElement("div");
          ph.className = "no-img";
          ph.textContent = imageNames[0] || "";
          card.appendChild(ph);
        }

        const no = document.createElement("div");
        no.className = "no";
        no.textContent = "No." + padNo(tsum.id);
        card.appendChild(no);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = tsum.name || "";
        card.appendChild(name);

        card.addEventListener("click", () => openModal(tsum));
        grid.appendChild(card);
      });
    }

    // ---------- Plus 圖章：裁掉透明邊 ----------
    // 圖章與文字標籤的原圖四周有很多透明空白，直接縮放會讓內容看起來很小，
    // 所以先用 canvas 找出有內容的範圍並裁切，結果快取起來。
    const trimCache = new Map();
    function trimImage(src) {
      if (trimCache.has(src)) return Promise.resolve(trimCache.get(src));
      return new Promise(resolve => {
        const im = new Image();
        im.onload = () => {
          const w = im.naturalWidth, h = im.naturalHeight;
          let result = { url: src, w, h, nw: w, nh: h };
          try {
            const c = document.createElement("canvas");
            c.width = w; c.height = h;
            const ctx = c.getContext("2d");
            ctx.drawImage(im, 0, 0);
            const d = ctx.getImageData(0, 0, w, h).data;
            let x0 = w, y0 = h, x1 = -1, y1 = -1;
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                if (d[(y * w + x) * 4 + 3] > 16) {
                  if (x < x0) x0 = x;
                  if (x > x1) x1 = x;
                  if (y < y0) y0 = y;
                  if (y > y1) y1 = y;
                }
              }
            }
            if (x1 >= 0) {
              const tw = x1 - x0 + 1, th = y1 - y0 + 1;
              const o = document.createElement("canvas");
              o.width = tw; o.height = th;
              o.getContext("2d").drawImage(c, x0, y0, tw, th, 0, 0, tw, th);
              result = { url: o.toDataURL("image/png"), w: tw, h: th, nw: w, nh: h };
            }
          } catch (e) { /* 裁切失敗就用原圖 */ }
          trimCache.set(src, result);
          resolve(result);
        };
        im.onerror = () => resolve({ url: src, w: 100, h: 100, nw: 100, nh: 100 });
        im.src = src;
      });
    }

    let plusToken = 0;
    // 顯示 skill label 與其下方的 Plus 圖章。兩者都先裁掉透明邊。
    // skill label 維持原本的視覺大小：原圖高度 = 15cqw。
    async function fillLabelRow(labelSrc, pairs) {
      const token = ++plusToken;
      const flat = pairs.flat();
      const [labelItem, ...flatItems] = await Promise.all(
        [labelSrc, ...flat].map(src => src ? trimImage(src) : Promise.resolve(null))
      );
      if (token !== plusToken || !modal.classList.contains("open")) return; // 已切換到別的 Tsum 或已關閉
      const row = modalBox.querySelector(".modal-label");
      if (!row) return;

      if (labelItem) {
        const ks = 15 / labelItem.nh;   // cqw per px
        row.innerHTML = `<img class="label-img" src="${labelItem.url}" alt="${ui().skillAlt}" style="--w:${labelItem.w};--ks:${ks}">`;
      } else {
        row.innerHTML = `<span class="none">${ui().none}</span>`;
      }

      const plusBox = modalBox.querySelector(".modal-plus");
      if (plusBox && pairs.length) {
        let i = 0;
        plusBox.innerHTML = pairs.map(pair =>
          `<div class="plus-item">` +
          pair.map(() => {
            const it = flatItems[i++];
            return `<img src="${it.url}" alt="" style="--w:${it.w}">`;
          }).join("") +
          `</div>`
        ).join("");
      }
    }

    // ---------- Skill Label 來源 ----------
    // JP 版只從 skilllabeljp.js (skillLabelMapJP) 讀取；GL 版只從 skilllabel.js (skillLabelMap) 讀取，兩邊不互相 fallback。
    // GL 切到 EN 時改讀 skilllabelen.js (skillLabelMapEN)；EN 圖裡找不到的 key 才退回 TW 圖。
    // JP 資料的 skill_label 若是空的，就用 image 名稱推出 win_tsumskill_<名稱>.png 去找。
    function getSkillLabelSrc(tsum) {
      const isJP = region === "jp";
      const isEN = !isJP && glLang === "en";
      const map = isEN
        ? (typeof skillLabelMapEN !== "undefined" ? skillLabelMapEN : null)
        : isJP
        ? (typeof skillLabelMapJP !== "undefined" ? skillLabelMapJP : null)
        : (typeof skillLabelMap !== "undefined" ? skillLabelMap : null);
      if (!map && isEN) {
        console.error("skillLabelMapEN 未定義：請確認 skilllabelen.js 第一行是 const skillLabelMapEN = {，暫時使用中文圖");
        return typeof skillLabelMap !== "undefined" && tsum.skill_label ? skillLabelMap[tsum.skill_label] : undefined;
      }
      if (!map) {
        console.error(isJP
          ? "skillLabelMapJP 未定義：請確認 skilllabeljp.js 第一行是 const skillLabelMapJP = {"
          : "skillLabelMap 未定義：請確認 skilllabel.js 有正確載入");
        return undefined;
      }
      let key = tsum.skill_label;
      if (!key && isJP) {
        const m = /^block_(.+?)_l\.png$/.exec(tsum.image || "");
        if (m) key = `win_tsumskill_${m[1]}.png`;
      }
      if (isEN && key && !map[key] && typeof skillLabelMap !== "undefined") {
        console.warn("skilllabelen.js 找不到 " + key + "，暫時用中文圖");
        return skillLabelMap[key];
      }
      return key ? map[key] : undefined;
    }

    // ---------- 詳細視窗 ----------
    function openModal(tsum) {
      const imageNames = getImageNames(tsum);
      const imgSrc = imageMap[imageNames[0]];
      const labelSrc = getSkillLabelSrc(tsum);

      // 各等級
      let rows = "";
      for (let i = 0; i < 6; i++) {
        const desc = tsum.skill_desc?.[i] || "";
        const cost = tsum.skill_cost?.[i];
        const hasCost = cost !== undefined && cost !== null;
        if (!desc && !hasCost) continue;

        rows += `
          <li class="skill-row">
            <span class="lv">SLv${i + 1}</span>
            <span class="desc">${parseDesc(desc)}</span>
            <span class="cost">${hasCost
              ? `<img src="${TICKET_IMG}" alt="ticket">× ${esc(cost)}`
              : ""}</span>
          </li>`;
      }

      // Plus 圖章：plus_pin / plus_pin_label 可以是單一字串，也可以是陣列（多組圖章），
      // 依順序一一配對；沒有資料就不顯示。
      const toArr = v => Array.isArray(v) ? v : (v ? [v] : []);
      const pins = toArr(tsum.plus_pin);
      const pinLabels = toArr(tsum.plus_pin_label);
      const plusPairs = [];
      for (let i = 0; i < Math.max(pins.length, pinLabels.length); i++) {
        // EN 的 label 讀 wappen_XXX_1_txt_en.png；pluspin.js 還沒有該圖時，退回原本沒有 _en 的圖
        const lbl = pinLabels[i];
        const lblImg = pinMap[lbl] || (lbl ? pinMap[String(lbl).replace(/_en\.png$/, ".png")] : undefined);
        if (lbl && !pinMap[lbl] && lblImg) console.warn("pluspin.js 找不到 " + lbl + "，暫時用中文圖");
        const pair = [pinMap[pins[i]], lblImg].filter(Boolean);
        if (pair.length) plusPairs.push(pair);
      }

      // 系列 / Tsum 類型（tsumtype 可為陣列或單一字串；沒有資料就不顯示）
      const types = (Array.isArray(tsum.tsumtype) ? tsum.tsumtype : (tsum.tsumtype ? [tsum.tsumtype] : []))
        .filter(Boolean);
      const infoHtml =
        (tsum.series ? `<div class="info-series"><span class="k">${ui().series}</span>${esc(tsum.series)}</div>` : "") +
        (types.length ? `<div class="info-types">${types.map(t => `<span class="info-type">${esc(t)}</span>`).join("")}</div>` : "");

      modalBox.innerHTML = `
        <div class="modal-head">
          ${imgSrc ? `<img src="${imgSrc}" alt="">` : ""}
          <div>
            <div class="no">No.${esc(padNo(tsum.id))}</div>
            <div class="name">${esc(tsum.name || "")}</div>
            ${tsum.name_en ? `<div class="name-en">${esc(tsum.name_en)}</div>` : ""}
          </div>
        </div>
        <div class="modal-body">
          <div class="modal-info">${infoHtml}</div>
          <div class="modal-label"></div>
          <div class="modal-plus"></div>
          ${rows
            ? `<ul class="skill-list">${rows}</ul>`
            : `<div class="skill-empty">${ui().noSkill}</div>`}
        </div>
      `;

      modal.classList.add("open");
      document.body.style.overflow = "hidden";
      modalBox.querySelector(".modal-body").scrollTop = 0;
      fillLabelRow(labelSrc, plusPairs);
    }

    function closeModal() {
      plusToken++;
      modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- 搜尋 ----------
    // GL(TW) = tsum.js 的 tsumData；JP = tsum_jp.js 的 tsumDataJP
    const byId = (a, b) => a.id - b.id;
    const dataSets = {
      gl: typeof tsumData !== "undefined" ? tsumData.slice().sort(byId) : [],
      jp: typeof tsumDataJP !== "undefined" ? tsumDataJP.slice().sort(byId) : [],
      glen: typeof tsumDataEN !== "undefined" ? tsumDataEN.slice().sort(byId) : []   // GL 英文版 = tsum_en.js 的 tsumDataEN
    };
    const langBtn = document.getElementById("langBtn");
    const langRow = document.getElementById("langRow");
    let glLang = "tw";
    try {
      if (localStorage.getItem("tsumGlLang") === "en") glLang = "en";
    } catch (e) {}
    if (!dataSets.glen.length) glLang = "tw";
    // 目前實際使用的資料集：GL 且選了 EN 時用英文版
    const curKey = () => (region === "gl" && glLang === "en") ? "glen" : region;
    const regionBtn = document.getElementById("regionBtn");

    let region = "gl";
    try {
      const saved = localStorage.getItem("tsumRegion");
      if (saved === "jp" || saved === "gl") region = saved;
    } catch (e) {}
    if (!dataSets[region].length) region = dataSets.gl.length ? "gl" : "jp";

    // 兩邊都有資料才能切換
    if (!dataSets.jp.length || !dataSets.gl.length) {
      regionBtn.disabled = true;
      regionBtn.title = "另一版本資料載入失敗";
    }
    if (!dataSets.glen.length) {
      langBtn.disabled = true;
      langBtn.title = "tsum_en.js 載入失敗";
    }

    // ---------- 分類：Series / Tsum Type（泡泡） ----------
    // Series：單選（再點一次取消）。Tsum Type：可多選，需同時符合。
    const filterPanel = document.getElementById("filterPanel");
    const seriesChips = document.getElementById("seriesChips");
    const typeChips = document.getElementById("typeChips");
    const fclear = document.getElementById("fclear");
    const typesOf = t => Array.isArray(t.tsumtype) ? t.tsumtype : (t.tsumtype ? [t.tsumtype] : []);
    let selSeries = "";
    const selTypes = new Set();

    function chipsHtml(counts) {
      return [...counts].map(([k, n]) =>
        `<button type="button" class="chip" data-v="${esc(k)}" aria-pressed="false">${esc(k)}<span class="n">${n}</span></button>`
      ).join("");
    }

    // 依目前版本的資料重建泡泡（依第一次出現的順序，並顯示數量）
    function buildFilters() {
      selSeries = "";
      selTypes.clear();
      const seriesCount = new Map(), typeCount = new Map();
      dataSets[curKey()].forEach(t => {
        if (t.series) seriesCount.set(t.series, (seriesCount.get(t.series) || 0) + 1);
        typesOf(t).forEach(k => typeCount.set(k, (typeCount.get(k) || 0) + 1));
      });
      seriesChips.innerHTML = chipsHtml(seriesCount);
      typeChips.innerHTML = chipsHtml(typeCount);
      filterPanel.classList.toggle("show", seriesCount.size > 0 || typeCount.size > 0);
      document.getElementById("seriesGroup").style.display = seriesCount.size ? "" : "none";
      document.getElementById("typeGroup").style.display = typeCount.size ? "" : "none";
      document.querySelectorAll(".fgroup").forEach(g => g.classList.remove("expanded"));
      updateMoreButtons();
    }

    // 只有內容超過兩行時才顯示「展開」
    function updateMoreButtons() {
      requestAnimationFrame(() => {
        document.querySelectorAll(".fgroup").forEach(g => {
          const chips = g.querySelector(".chips");
          const btn = g.querySelector(".fmore");
          const expanded = g.classList.contains("expanded");
          btn.hidden = !expanded && chips.scrollHeight <= chips.clientHeight + 1;
          btn.textContent = expanded ? ui().less : ui().more;
        });
      });
    }
    window.addEventListener("resize", updateMoreButtons);

    document.querySelectorAll(".fmore").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById(btn.dataset.for).classList.toggle("expanded");
        updateMoreButtons();
      });
    });

    seriesChips.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      selSeries = selSeries === chip.dataset.v ? "" : chip.dataset.v;
      applyFilter();
    });
    typeChips.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const v = chip.dataset.v;
      if (selTypes.has(v)) selTypes.delete(v); else selTypes.add(v);
      applyFilter();
    });
    fclear.addEventListener("click", () => {
      selSeries = "";
      selTypes.clear();
      applyFilter();
    });

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      seriesChips.querySelectorAll(".chip").forEach(c => {
        const on = c.dataset.v === selSeries;
        c.classList.toggle("on", on);
        c.setAttribute("aria-pressed", on);
      });
      typeChips.querySelectorAll(".chip").forEach(c => {
        const on = selTypes.has(c.dataset.v);
        c.classList.toggle("on", on);
        c.setAttribute("aria-pressed", on);
      });
      fclear.hidden = !selSeries && !selTypes.size;

      render(dataSets[curKey()].filter(tsum => {
        if (selSeries && tsum.series !== selSeries) return false;
        if (selTypes.size) {
          const mine = typesOf(tsum);
          for (const t of selTypes) if (!mine.includes(t)) return false;
        }
        return !q ||
          tsum.name?.toLowerCase().includes(q) ||
          tsum.name_en?.toLowerCase().includes(q) ||
          String(tsum.id).includes(q);
      }));
    }

    // 依目前語言更新介面文字與語言按鈕（只有 GL 才顯示語言按鈕）
    function applyI18n() {
      uiLang = region === "jp" ? "jp" : (glLang === "en" ? "en" : "tw");
      document.documentElement.lang = { jp: "ja", en: "en", tw: "zh-Hant" }[uiLang];
      langRow.hidden = region !== "gl";
      langBtn.textContent = "🌐 " + (glLang === "en" ? "EN" : "TW");
      if (document.activeElement !== searchInput) searchInput.placeholder = ui().placeholder;
      emptyMsg.textContent = ui().empty;
      fclear.textContent = ui().clear;
    }

    function setRegion(r) {
      region = r;
      regionBtn.textContent = r.toUpperCase();
      try { localStorage.setItem("tsumRegion", r); } catch (e) {}
      applyI18n();
      buildFilters();
      applyFilter();
    }

    langBtn.addEventListener("click", () => {
      glLang = glLang === "en" ? "tw" : "en";
      try { localStorage.setItem("tsumGlLang", glLang); } catch (e) {}
      applyI18n();
      buildFilters();   // 英文版的 Series / Type 名稱不同，要重建分類並清掉已選的
      applyFilter();
    });

    regionBtn.addEventListener("click", () => {
      setRegion(region === "gl" ? "jp" : "gl");
    });

    searchInput.addEventListener("input", applyFilter);

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      selSeries = "";
      selTypes.clear();
      applyFilter();
      searchInput.focus();
    });

    setRegion(region);

    searchInput.addEventListener("focus", () => { searchInput.placeholder = ""; });
    searchInput.addEventListener("blur", () => {
      if (!searchInput.value) searchInput.placeholder = ui().placeholder;
    });

    // ---------- 深淺色切換 ----------
    const themeBtn = document.getElementById("themeBtn");
    const root = document.documentElement;

    function updateThemeBtn() {
      const isDark = root.getAttribute("data-theme") === "dark";
      themeBtn.textContent = isDark ? "☀️" : "🌙";
    }

    themeBtn.addEventListener("click", () => {
      const toDark = root.getAttribute("data-theme") !== "dark";
      if (toDark) root.setAttribute("data-theme", "dark");
      else root.removeAttribute("data-theme");
      try { localStorage.setItem("tsumTheme", toDark ? "dark" : "light"); } catch (e) {}
      updateThemeBtn();
    });
    updateThemeBtn();

    // ---------- 捲動按鈕 ----------
    document.getElementById("scrollTopBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("scrollBottomBtn").addEventListener("click", () => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });
  </script>
</body>
</html>
