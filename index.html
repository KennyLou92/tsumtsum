<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎵TsumTsum 列表</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #eee;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: center;
      vertical-align: middle;
    }
    td.img-cell {
      width: 60px;
      padding: 4px;
    }
    .img-cell img {
      width: 60px;
      height: 60px;
      display: block;
      margin: 0 auto 4px;
    }
    .name-label {
      font-weight: bold;
      display: block;
      margin-top: 4px;
    }
    .skill-desc {
      width: 70px;
      max-width: 70px;
      word-wrap: break-word;
      white-space: normal;
    }
    .skill-icon {
      height: 30px;
      vertical-align: middle;
    }
    .label-icon {
      width: 190px;
      height: 100px;
      display: block;
      margin: 0 auto;
    }
    td.label-cell, th.label-cell {
      width: 80px;
      max-width: 80px;
    }

    #search-container {
      position: sticky;
      top: 0;
      padding: 10px;
      margin: 10px 0 10px 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      background-color: rgba(34, 34, 34, 0.9); /* 加上微透明背景避免滑動時字體重疊 */
    }

    #search {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #333;
      color: #eee;
    }

    #clearSearchBtn {
      width: 35px;
      height: 35px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    #clearSearchBtn:hover {
      opacity: 1;
    }

    .scroll-button {
      position: fixed;
      right: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      opacity: 0.1;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .scroll-button:hover {
      opacity: 1;
    }
    #scrollTopBtn {
      bottom: 80px;
    }
    #scrollBottomBtn {
      bottom: 20px;
    }
  </style>
</head>
<body class="dark">
  <div id="search-container">
    <input type="text" id="search" placeholder="🔍 輸入Tsum名稱..." />
    <img id="clearSearchBtn" src="https://i.postimg.cc/6pVSz87S/win-batsu-s.png" alt="Clear" />
  </div>

  <table>
    <thead>
      <tr>
        <th>Tsum</th>
        <th class="label-cell">Tsum技能</th>
        <th>SLv1</th>
        <th>SLv2</th>
        <th>SLv3</th>
        <th>SLv4</th>
        <th>SLv5</th>
        <th>SLv6</th>
      </tr>
    </thead>
    <tbody id="tsumBody"></tbody>
  </table>

  <img id="scrollTopBtn" class="scroll-button" src="https://i.postimg.cc/RZRdN8b6/win-arrow-up.png" alt="Top" />
  <img id="scrollBottomBtn" class="scroll-button" src="https://i.postimg.cc/MGpDRDhs/win-arrow-down.png" alt="Bottom" />

  <script src="tsum.js"></script>
  <script src="images.js"></script>
  <script src="skilllabel.js"></script>
  <script src="littletsum.js"></script>

  <script>
    const imageMap = images || {};
    const tbody = document.getElementById("tsumBody");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearchBtn");

    // 1. 預先編譯替換規則，避免在迴圈中重複運算
    const iconReplacementRules = [];
    (window.littletsumData || []).forEach(item => {
      const key = Object.keys(item)[0];
      const filename = item[key];
      const base64 = imageMap[filename];
      if (base64) {
        iconReplacementRules.push({
          key: key,
          tag: `<img src="${base64}" class="skill-icon">`
        });
      }
    });

    function render(data) {
      tbody.innerHTML = "";
      
      // 2. 使用 DocumentFragment 來減少重繪 (Reflow/Repaint)
      const fragment = document.createDocumentFragment();

      data.forEach(tsum => {
        const imageNames = Array.isArray(tsum.image)
          ? tsum.image
          : (tsum.image || "").split(",").map(s => s.trim());
        let imageIndex = 0;

        const row = document.createElement("tr");

        // --- Tsum 圖片與名稱 ---
        const imgTd = document.createElement("td");
        imgTd.className = "img-cell";

        if (imageNames.length > 0 && imageMap[imageNames[0]]) {
          const img = document.createElement("img");
          // 啟用瀏覽器原生的懶加載功能
          img.loading = "lazy"; 
          img.src = imageMap[imageNames[0]];
          imgTd.appendChild(img);

          const nameSpan = document.createElement("span");
          nameSpan.className = "name-label";
          nameSpan.textContent = tsum.name;
          imgTd.appendChild(nameSpan);

          // 圖片輪播事件
          if (imageNames.length > 1) {
            let intervalId = null;
            img.addEventListener("mouseenter", () => {
              intervalId = setInterval(() => {
                imageIndex = (imageIndex + 1) % imageNames.length;
                const next = imageMap[imageNames[imageIndex]];
                if (next) img.src = next;
              }, 500);
            });
            img.addEventListener("mouseleave", () => {
              clearInterval(intervalId);
              img.src = imageMap[imageNames[0]];
              imageIndex = 0;
            });
          }
        } else {
          imgTd.textContent = (imageNames[0] || "未知") + "\n" + tsum.name;
        }
        row.appendChild(imgTd);

        // --- 技能標籤 ---
        const labelTd = document.createElement("td");
        labelTd.className = "label-cell";
        const labelKey = tsum.skill_label;
        if (labelKey && skillLabelMap && skillLabelMap[labelKey]) {
          const labelImg = document.createElement("img");
          labelImg.loading = "lazy";
          labelImg.src = skillLabelMap[labelKey];
          labelImg.className = "label-icon";
          labelTd.appendChild(labelImg);
        } else {
          labelTd.textContent = "暫無";
        }
        row.appendChild(labelTd);

        // --- 技能描述 (SLv1 ~ SLv6) ---
        for (let i = 0; i < 6; i++) {
          const td = document.createElement("td");
          td.className = "skill-desc";

          let rawDesc = tsum.skill_desc?.[i] || "";
          const cost = tsum.skill_cost?.[i];

          // 替換圖標 (使用預先算好的規則)
          if (rawDesc) {
            iconReplacementRules.forEach(rule => {
              rawDesc = rawDesc.replaceAll(rule.key, rule.tag);
            });
          }

          // 處理換行與空白
          let mainDesc = "";
          if (rawDesc) {
            const descLines = rawDesc.split('\n');
            descLines.forEach(line => {
              mainDesc += line
                .split(/(<img.*?>)/)
                .map(part => part.startsWith('<img') ? part : part.replaceAll(' ', '<br>'))
                .join('') + '<br>';
            });
          }

          // 技能花費
          let costLine = "";
          if (cost !== undefined && cost !== null) {
            costLine = `
            <div style="margin-top: 4px;">
              <img src="https://i.postimg.cc/nzcz0QBq/win-i-ticket-S.png" 
                   alt="ticket" loading="lazy"
                   style="height: 24px; vertical-align: middle; margin-right: 4px;">
              × ${cost}
            </div>`;
          }

          td.innerHTML = mainDesc + costLine;
          row.appendChild(td);
        }

        fragment.appendChild(row);
      });

      // 將所有組合好的元素一次性放入 DOM 中
      tbody.appendChild(fragment);
    }

    // 初始化與排序
    const sorted = (window.tsumData || []).sort((a, b) => a.id - b.id);
    render(sorted);

    // 3. 搜尋防抖 (Debounce) 功能
    function debounce(func, delay) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => func.apply(this, args), delay);
      };
    }

    const handleSearch = debounce(() => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        render(sorted);
        return;
      }
      const filtered = sorted.filter(tsum =>
        tsum.name?.toLowerCase().includes(q) ||
        tsum.name_en?.toLowerCase().includes(q)
      );
      render(filtered);
    }, 300); // 延遲 300 毫秒觸發

    searchInput.addEventListener("input", handleSearch);

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render(sorted);
      searchInput.focus();
    });

    // 搜尋框樣式小細節
    searchInput.addEventListener("focus", () => searchInput.placeholder = "");
    searchInput.addEventListener("blur", () => {
      if (!searchInput.value) searchInput.placeholder = "🔍 輸入Tsum名稱...";
    });

    document.getElementById("scrollTopBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("scrollBottomBtn").addEventListener("click", () => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });
  </script>
</body>
</html>
