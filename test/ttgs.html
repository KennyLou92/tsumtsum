<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tsum 抽卡模擬器</title>
<style>
body {
  background-color: #222;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}
.banner {
  width: 90%;
  max-width: 600px;
  border-radius: 12px;
  margin: 20px auto;
  display: block;
}
button {
  background-color: #ff4081;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 10px;
}
button:hover {
  background-color: #e73370;
}
.result-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}
.result {
  background-color: #333;
  border-radius: 10px;
  padding: 10px;
  margin: 5px;
  width: 100px;
  text-align: center;
}
.result img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}
.name {
  margin-top: 5px;
  font-size: 13px;
}
</style>
</head>
<body>

<h2>Tsum 抽卡模擬器</h2>

<img id="banner" class="banner" src="" alt="box banner">

<button id="drawBtn">抽一抽 🎲</button>

<div id="results" class="result-container"></div>

<!-- 外部資料 -->
<script src="selectbox.js"></script>
<script src="tsum.js"></script>
<script src="images.js"></script>

<!-- 主邏輯 -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // 兼容 const 定義
  const boxes = typeof selectbox !== "undefined" ? selectbox : window.selectbox;
  const tsumList = typeof tsumData !== "undefined" ? tsumData : window.tsumData;
  const imgData = typeof images !== "undefined" ? images : window.images;

  // 尋找 novbox
  const currentBox = boxes.find(b => b.box === "novbox");
  if (!currentBox) {
    alert("找不到 novbox，請確認 selectbox.js 是否包含。");
    return;
  }

  const banner = document.getElementById("banner");
  const drawBtn = document.getElementById("drawBtn");
  const resultsDiv = document.getElementById("results");

  banner.src = currentBox.box_label;

  // 載入舊抽卡紀錄
  let drawHistory = JSON.parse(localStorage.getItem("drawResults_novbox") || "[]");
  drawHistory.forEach(showResult);

  drawBtn.addEventListener("click", () => {
    const tsumIdList = currentBox.box_tsum;
    const randomId = tsumIdList[Math.floor(Math.random() * tsumIdList.length)];
    const tsum = tsumList.find(t => t.id === randomId);
    if (!tsum) {
      console.warn("找不到對應的 tsum id:", randomId);
      return;
    }

    drawHistory.push(randomId);
    localStorage.setItem("drawResults_novbox", JSON.stringify(drawHistory));

    showResult(randomId);
  });

  function showResult(tsumId) {
    const tsum = tsumList.find(t => t.id === tsumId);
    if (!tsum) return;

    const div = document.createElement("div");
    div.className = "result";
    const img = document.createElement("img");
    img.src = imgData[tsum.image] || "https://via.placeholder.com/80";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = tsum.name;
    div.appendChild(img);
    div.appendChild(name);
    resultsDiv.appendChild(div);
  }
});
</script>

</body>
</html>
