<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tsum Tsum 抽卡模擬器</title>
<style>
  body {
    background-color: #121212;
    color: #fff;
    font-family: "Microsoft JhengHei", sans-serif;
    text-align: center;
  }
  #banner {
    width: 600px;
    margin: 20px auto;
    display: block;
    border-radius: 12px;
    box-shadow: 0 0 10px #000;
  }
  #button-container {
    margin: 20px;
  }
  .draw-btn {
    background-color: #333;
    border: none;
    color: #fff;
    font-size: 20px;
    padding: 12px 24px;
    border-radius: 8px;
    margin: 10px;
    cursor: pointer;
    transition: 0.3s;
  }
  .draw-btn:hover {
    background-color: #555;
    transform: scale(1.05);
  }
  #results {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
  }
  .tsum {
    width: 90px;
    height: 90px;
    margin: 8px;
    border-radius: 12px;
    background-image: url("https://i.postimg.cc/wBpXSbwN/win-list-panel-off.png");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 5px #000;
  }
  .tsum img {
    width: 70px;
    height: 70px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<!--<h1>Tsum Tsum 抽卡模擬器</h1>-->
<img id="banner" src="" alt="Box Banner">

<div id="button-container">
  <button class="draw-btn" id="singleDraw">單抽</button>
  <button class="draw-btn" id="multiDraw">10連抽</button>
</div>

<div id="results"></div>

<script src="selectbox.js"></script>
<script src="tsum.js"></script>
<script src="images.js"></script>

<script>
  const novbox = selectbox.find(b => b.box === "novbox");
  const tsumList = tsumData; // 來自 tsum.js
  const imageList = images;  // 來自 image.js

  document.getElementById("banner").src = novbox.box_label;

  const resultsContainer = document.getElementById("results");
  let results = [];

  function getRandomTsum() {
    const randomId = novbox.box_tsum[Math.floor(Math.random() * novbox.box_tsum.length)];
    const tsum = tsumList.find(t => t.id === randomId);
    const tsumImage = imageList[tsum.image];
    return tsumImage ? tsumImage : null;
  }

  function draw(count) {
    for (let i = 0; i < count; i++) {
      const imgSrc = getRandomTsum();
      if (imgSrc) {
        results.unshift(imgSrc); // 新抽出的放最前面
      }
    }
    if (results.length > 30) results = results.slice(0, 30); // 保留最近30個
    updateResults();
  }

  function updateResults() {
    resultsContainer.innerHTML = "";
    results.forEach(img => {
      const div = document.createElement("div");
      div.className = "tsum";
      const image = document.createElement("img");
      image.src = img;
      div.appendChild(image);
      resultsContainer.appendChild(div);
    });
  }

  document.getElementById("singleDraw").addEventListener("click", () => draw(1));
  document.getElementById("multiDraw").addEventListener("click", () => draw(10));
</script>

</body>
</html>
