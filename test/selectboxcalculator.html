<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tsum 金幣計算器</title>
  <style>
    body {
      font-family: sans-serif;
      background: url('bluebg.png') repeat;
      background-size: auto;
    }
    #tsumArea {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 10px;
    }
    .tsum-container {
      border: 2px solid #999;
      border-radius: 10px;
      padding: 4px;
      text-align: center;
      background-color: #fff;
    }
    .tsum-img {
      width: 130px;
      height: 130px;
      border-radius: 10px;
    }
    .name {
      font-size: 20px;
      margin-top: 8px;
      font-weight: bold;
      color: black;
    }
    .dropdown-wrap {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }
    select {
      font-size: 14px;
      padding: 4px;
    }
    .coin-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      gap: 6px;
    }
    .coin-line img {
      width: 18px;
      height: 18px;
    }
    .gold {
      font-weight: bold;
      color: #cc9900;
      font-size: 15px;
    }
    #totalWrapper {
      text-align: center;
      margin-top: 30px;
      font-size: 50px;
      color: #cc9900;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    #totalWrapper img {
      width: 50px;
      height: 50px;
    }
    #boxSelectorWrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      gap: 5px;
    }
    .tsum-dropdown {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    .tsum-selected {
      height: 108px;
      width: 524px;
      border: none;
      border-radius: 8px;
      object-fit: contain;
    }
    .tsum-dropdown-list {
      display: none;
      position: absolute;
      top: 60px;
      left: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 100;
      padding: 5px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .tsum-dropdown-list.show {
      display: flex;
      flex-direction: column;
    }
    .tsum-dropdown-item {
      height: 108px;
      width: 524px;
      margin: 5px 0;
      cursor: pointer;
      transition: transform 0.2s ease;
      object-fit: contain;
    }
    .tsum-dropdown-item:hover {
      transform: scale(1.05);
    }
    .countdown {
      font-size: 16px;
      color: #333;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="boxSelectorWrapper">
    <div id="countdownBox" class="countdown"></div>
    <div id="rateupCountdown" class="countdown"></div>
  </div>
  <div id="tsumArea"></div>

  <div id="totalWrapper">
    <img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png" alt="coin" />
    <span id="totalGold">0</span>
  </div>

  <!-- 🔹 YouTube 背景音樂 (隱藏播放器) -->
  <div id="player" style="width:0;height:0;overflow:hidden;"></div>

  <script src="tsum.js"></script>
  <script src="selectbox.js"></script>
  <script src="images.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* ========= YouTube 背景音樂控制 ========= */
    let ytPlayer;

    // 設定音樂播放時間 (Unix 秒數)
    const musicStart = 1758877197; // 例: 2025/09/26 16:00 (MYT)
    const musicEnd   = 1761926399; // 例: 2025/09/30 23:59 (MYT)

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'ZVuToMilP0A', // 👈 換成你的 YouTube 音樂 ID
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: 'ZVuToMilP0A'
        },
        events: {
          'onReady': () => {
            ytPlayer.setVolume(10); // 音量
            controlBGM(musicStart, musicEnd);
          }
        }
      });
    }

    function controlBGM(start, end) {
      function updateBGM() {
        const now = Math.floor(Date.now() / 1000);
        if (now >= start && now < end) {
          if (ytPlayer && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
            ytPlayer.playVideo();
          }
        } else {
          if (ytPlayer && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
          }
        }
      }
      updateBGM();
      setInterval(updateBGM, 1000);
    }

    /* ========= 你原本的 JS (保留) ========= */
    const tsumMap = {};
    tsumData.forEach(tsum => {
      tsumMap[tsum.id] = tsum;
    });

    const GOLD_PER_COST = 30000;
    const tsumArea = document.getElementById("tsumArea");
    const countdownBox = document.getElementById("countdownBox");
    const rateupCountdown = document.getElementById("rateupCountdown");
    let countdownInterval, rateupInterval;

    function createTsumBox(tsumId) {
      const tsum = tsumMap[tsumId];
      if (!tsum || !tsum.skill_cost) return null;
      const container = document.createElement("div");
      container.className = "tsum-container";

      const img = document.createElement("img");
      img.className = "tsum-img";
      img.src = images[tsum.image] || "";
      container.appendChild(img);

      const nameLine = document.createElement("div");
      nameLine.className = "name";
      nameLine.textContent = tsum.name;
      container.appendChild(nameLine);

      const levelSelect = document.createElement("select");
      for (let i = 0; i <= 6; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `SLv${i}`;
        levelSelect.appendChild(option);
      }

      const dropdownWrap = document.createElement("div");
      dropdownWrap.className = "dropdown-wrap";
      dropdownWrap.appendChild(levelSelect);
      container.appendChild(dropdownWrap);

      const coinLine = document.createElement("div");
      coinLine.className = "coin-line";
      coinLine.innerHTML = `
        <img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png" alt="coin" />
        <span class="gold">0</span>
      `;
      container.appendChild(coinLine);

      function updateGold() {
        const level = parseInt(levelSelect.value);
        const totalCost = tsum.skill_cost.reduce((a, b) => a + b, 0);
        const ownedCost = tsum.skill_cost.slice(0, level).reduce((a, b) => a + b, 0);
        const remainingCost = totalCost - ownedCost;
        const gold = remainingCost * GOLD_PER_COST;
        coinLine.querySelector("span").textContent = gold.toLocaleString();
        updateTotal();
      }

      levelSelect.addEventListener("change", updateGold);
      updateGold();

      container._getGold = () => {
        const level = parseInt(levelSelect.value);
        const totalCost = tsum.skill_cost.reduce((a, b) => a + b, 0);
        const ownedCost = tsum.skill_cost.slice(0, level).reduce((a, b) => a + b, 0);
        const remainingCost = totalCost - ownedCost;
        return remainingCost * GOLD_PER_COST;
      };

      return container;
    }

    function updateTotal() {
      let total = 0;
      document.querySelectorAll(".tsum-container").forEach(c => {
        if (typeof c._getGold === 'function') total += c._getGold();
      });
      document.getElementById("totalGold").textContent = total.toLocaleString();
    }

    function renderCountdown(start, end, element, label) {
      clearInterval(element === countdownBox ? countdownInterval : rateupInterval);
      function update() {
        const now = Math.floor(Date.now() / 1000);
        let target, prefix;
        if (now < start) {
          target = start; prefix = label + "開始於";
        } else if (now >= start && now < end) {
          target = end; prefix = label + "結束於";
        } else {
          element.textContent = label + "已結束";
          return;
        }
        const diff = target - now;
        const d = Math.floor(diff / 86400);
        const h = Math.floor((diff % 86400) / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        element.textContent = `${prefix} ${d}天 ${h}時 ${m}分 ${s}秒`;
      }
      update();
      const interval = setInterval(update, 1000);
      if (element === countdownBox) countdownInterval = interval;
      else rateupInterval = interval;
    }

    const boxSelectorWrapper = document.getElementById("boxSelectorWrapper");

    function createImageDropdown() {
      const dropdown = document.createElement("div");
      dropdown.className = "tsum-dropdown";
      const selected = document.createElement("img");
      selected.className = "tsum-selected";
      const firstVisibleBox = selectbox.find(box => box.show !== 0);
      selected.src = firstVisibleBox?.box_label || "";
      dropdown.appendChild(selected);

      const list = document.createElement("div");
      list.className = "tsum-dropdown-list";

      selectbox.forEach((box, index) => {
        if (box.box_label && box.show !== 0) {
          const item = document.createElement("img");
          item.src = box.box_label;
          item.className = "tsum-dropdown-item";
          item.onclick = () => {
            selected.src = box.box_label;
            list.classList.remove("show");
            renderBox(index);
          };
          list.appendChild(item);
        }
      });

      selected.onclick = () => list.classList.toggle("show");
      dropdown.appendChild(list);
      boxSelectorWrapper.insertBefore(dropdown, countdownBox);
    }

    function renderBox(index) {
      tsumArea.innerHTML = "";
      const box = selectbox[index];
      box.box_tsum.forEach(tsumId => {
        const el = createTsumBox(tsumId);
        if (el) tsumArea.appendChild(el);
      });
      updateTotal();

      if (box.startdate && box.enddate) {
        countdownBox.style.display = "block";
        renderCountdown(box.startdate, box.enddate, countdownBox, "");
      } else {
        countdownBox.style.display = "none";
        clearInterval(countdownInterval);
        countdownBox.textContent = "";
      }

      if (box.rateupstartdate && box.rateupenddate) {
        rateupCountdown.style.display = "block";
        renderCountdown(box.rateupstartdate, box.rateupenddate, rateupCountdown, "Rate Up");
      } else {
        rateupCountdown.style.display = "none";
        clearInterval(rateupInterval);
        rateupCountdown.textContent = "";
      }
    }

    createImageDropdown();
    const initialIndex = selectbox.findIndex(b => b.show !== 0);
    if (initialIndex !== -1) renderBox(initialIndex);
  </script>
</body>
</html>
