<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsum Tsum 抽卡模擬器 (Debug 模式)</title>
<style>
  body {
    background-color: #fafafa;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  #banner {
    width: 80%;
    max-width: 600px;
    margin: 20px auto;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  #drawButton {
    background-color: #007bff;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 15px;
    font-size: 18px;
  }
  #drawButton:hover {
    background-color: #0056b3;
  }
  #resultContainer {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .tsum {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(0,0,0,0.3);
    background-size: cover;
  }
  #debug {
    background-color: #111;
    color: #0f0;
    font-family: monospace;
    padding: 10px;
    text-align: left;
    max-width: 800px;
    margin: 30px auto;
    border-radius: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>Tsum Tsum 抽卡模擬器 (Debug 模式)</h1>

<img id="banner" alt="Box Banner">

<br>
<button id="drawButton">抽一個 Tsum！</button>

<div id="resultContainer"></div>

<pre id="debug">[DEBUG] 初始化中...</pre>

<!-- 外部 JS -->
<script src="selectbox.js"></script>
<script src="tsum.js"></script>
<script src="images.js"></script>

<script>
const debug = (msg) => {
  const el = document.getElementById('debug');
  el.textContent += "\n" + msg;
  console.log(msg);
};

let boxData;
let tsumData = {};
let imageData = {};

window.onload = function() {
  debug("[DEBUG] 頁面載入完成。");

  try {
    boxData = selectBoxes.find(b => b.box === "novbox");
    document.getElementById("banner").src = boxData.box_label;
    debug("[DEBUG] 已載入 box: " + boxData.box + "，共 " + boxData.box_tsum.length + " 個 tsum。");
  } catch (e) {
    debug("[ERROR] selectbox.js 讀取失敗: " + e);
  }

  try {
    tsumData = tsumList;
    debug("[DEBUG] tsum.js 已載入，共 " + Object.keys(tsumData).length + " 個 tsum。");
  } catch (e) {
    debug("[ERROR] tsum.js 讀取失敗: " + e);
  }

  try {
    imageData = images;
    debug("[DEBUG] images.js 已載入，共 " + Object.keys(imageData).length + " 張圖片。");
  } catch (e) {
    debug("[ERROR] images.js 讀取失敗: " + e);
  }

  document.getElementById("drawButton").addEventListener("click", drawTsum);
};

function drawTsum() {
  if (!boxData || !boxData.box_tsum) {
    debug("[ERROR] boxData 尚未載入！");
    return;
  }

  const tsumId = boxData.box_tsum[Math.floor(Math.random() * boxData.box_tsum.length)];
  const tsum = tsumData[tsumId];
  if (!tsum) {
    debug("[WARN] 找不到 tsumId: " + tsumId);
    return;
  }

  const imgName = tsum.image;
  const imgBase64 = imageData[imgName];

  if (!imgBase64) {
    debug("[WARN] 找不到圖片: " + imgName);
    return;
  }

  const imgEl = document.createElement("div");
  imgEl.classList.add("tsum");
  imgEl.style.backgroundImage = `url(${imgBase64})`;

  document.getElementById("resultContainer").appendChild(imgEl);
  debug(`[INFO] 抽到 tsum: ID=${tsumId}, 名稱=${tsum.name || "未知"}, 圖=${imgName}`);
}
</script>

</body>
</html>
