<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tsum 金幣計算器</title>
  <style>
    body {
      font-family: sans-serif;
      background: url('bluebg.png') repeat;
      background-size: auto;
    }
    #tsumArea {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 10px;
    }
    .tsum-container {
      border: 2px solid #999;
      border-radius: 10px;
      padding: 4px;
      text-align: center;
      background-color: #fff;
      position: relative;
    }
    .tsum-img {
      width: 130px;
      height: 130px;
      border-radius: 10px;
    }
    .name {
      font-size: 20px;
      margin-top: 8px;
      font-weight: bold;
      color: black;
    }
    
    /* 更新 UI 排版 */
    .dropdown-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6px;
      gap: 6px;
    }
    select {
      font-size: 14px;
      padding: 4px;
    /*  width: 90%; */
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    /* 技能進度條的專屬設定 */
    .tsum-progress-bar {
      position: relative;
      width: 74px;  /* 固定寬度 */
      height: 18px; /* 固定高度 */
      border-radius: 9px;
      overflow: hidden;
      background-color: #222;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    .tsum-progress-bar > img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .tsum-progress-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      z-index: 2;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    .tsum-progress-fill img {
      height: 100%;
      width: 74px; /* 必須跟父層固定寬度一樣，防止圖片變形，藉由外層 div 的 width 來裁切 */
      max-width: none;
    }
    .tsum-progress-text {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      text-align: center;
      z-index: 3;
      font-size: 11px;
      color: white;
      font-weight: bold;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      line-height: 18px;
      pointer-events: none;
    }

    .coin-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      gap: 6px;
    }
    .coin-line img {
      width: 18px;
      height: 18px;
    }
    .gold {
      font-weight: bold;
      color: #cc9900;
      font-size: 15px;
    }
    #totalWrapper {
      text-align: center;
      margin-top: 30px;
      font-size: 50px;
      color: #cc9900;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    #totalWrapper img {
      width: 50px;
      height: 50px;
    }
    #boxSelectorWrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
    }
    #countdownArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-height: 60px;
      justify-content: flex-start;
    }
    .tsum-dropdown {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    .tsum-selected {
      height: 108px;
      width: 524px;
      border: none;
      border-radius: 8px;
      object-fit: contain;
    }
    .tsum-dropdown-list {
      display: none;
      position: absolute;
      top: 112px;
      left: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      z-index: 100;
      padding: 5px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      max-height: 360px;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      box-sizing: border-box;
      width: 524px;
    }
    .tsum-dropdown-list::-webkit-scrollbar {
      display: none;
    }
    .tsum-dropdown-list.show {
      display: flex;
      flex-direction: column;
    }
    .tsum-dropdown-item {
      height: 108px;
      width: 100%;
      margin: 5px 0;
      cursor: pointer;
      transition: transform 0.2s ease;
      object-fit: contain;
      border-radius: 8px;
    }
    .tsum-dropdown-item:hover {
      transform: scale(1.02);
    }
    .countdown {
      font-size: 16px;
      color: #333;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 6px;
    }
    #resetLevels {
      position: fixed;
      top: 10px;
      right: 10px;
      cursor: pointer;
      z-index: 2000;
    }
    #resetLevels:hover::after {
      content: "Reset Skills";
      position: absolute;
      top: 40px;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
    }
    .dropdown-wrap img {
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="resetLevels">
    <img src="https://i.postimg.cc/7hZzRzFR/reset.png" alt="Reset" width="64" height="64" />
  </div>

  <div id="boxSelectorWrapper">
    <div id="countdownArea">
      <div id="countdownBox" class="countdown" style="display:none;"></div>
      <div id="rateupCountdown" class="countdown" style="display:none;"></div>
    </div>
  </div>
  
  <div id="tsumArea"></div>

  <div id="totalWrapper">
    <img src="https://i.postimg.cc/QMTy8Ffx/win-coin.png" alt="coin" />
    <span id="totalGold">0</span>
  </div>

  <script src="tsum.js"></script>
  <script src="selectbox.js"></script>
  <script src="images.js"></script>
  <script>
    function isBoxVisible(box) {
      const now = Math.floor(Date.now() / 1000);
      if (box.enddate && now >= box.enddate) return false;
      if (box.show !== undefined) return box.show !== 0;
      return box.startdate && box.enddate ? (now >= box.startdate && now < box.enddate) : false;
    }

    const tsumMap = {};
    tsumData.forEach(tsum => tsumMap[tsum.id] = tsum);

    const GOLD_PER_COST = 30000;
    const MEDAL_PER_COST = 10000;
    const IMAGE_COIN = "https://i.postimg.cc/QMTy8Ffx/win-coin.png";
    const IMAGE_MEDAL = "https://i.postimg.cc/pTbCqB8P/win-medal-lastone.png";

    let currentBoxType = "gold"; 
    const tsumArea = document.getElementById("tsumArea");
    const countdownBox = document.getElementById("countdownBox");
    const rateupCountdown = document.getElementById("rateupCountdown");
    let countdownInterval, rateupInterval;

    // 🚀 新增：轉移原本只存 Level 的舊資料，改成儲存精準的「抽箱總數量(Total Boxes)」
    let savedBoxes = {};
    try {
      savedBoxes = JSON.parse(localStorage.getItem("savedBoxes"));
      if (!savedBoxes) {
        savedBoxes = {};
        const legacyLevels = JSON.parse(localStorage.getItem("savedLevels"));
        if (legacyLevels) {
          for (let id in legacyLevels) {
            const lvl = legacyLevels[id];
            if (tsumMap[id] && tsumMap[id].skill_cost) {
              // 將原本的等級轉換為抵達該等級所需的總隻數
              savedBoxes[id] = tsumMap[id].skill_cost.slice(0, lvl).reduce((a, b) => a + b, 0);
            }
          }
          localStorage.removeItem("savedLevels");
          localStorage.setItem("savedBoxes", JSON.stringify(savedBoxes));
        }
      }
    } catch (e) {
      savedBoxes = {};
    }
    const saveBoxesToStorage = () => localStorage.setItem("savedBoxes", JSON.stringify(savedBoxes));

    // 🚀 新增：根據擁有的「總箱數」計算當前等級、升級所需、%數
    function getLevelInfo(boxes, skillCost) {
      let level = 0;
      let remainder = boxes;
      let nextCost = skillCost[0] || 0;
      
      for (let i = 0; i < skillCost.length; i++) {
        if (remainder >= skillCost[i]) {
          remainder -= skillCost[i];
          level = i + 1;
          nextCost = skillCost[i + 1] || 0; 
        } else {
          nextCost = skillCost[i];
          break;
        }
      }
      
      let isMax = (level === skillCost.length);
      let percent = isMax ? 100 : Math.floor((remainder / nextCost) * 100);
      
      return { level, percent, isMax };
    }

    function createTsumBox(tsumId) {
      const tsum = tsumMap[tsumId];
      if (!tsum?.skill_cost) return null;

      const container = document.createElement("div");
      container.className = "tsum-container";

      // 判斷是否為當月新 Tsum
      if (tsum.startdate) {
        const now = new Date(), d = new Date(tsum.startdate * 1000);
        if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
          const newIcon = document.createElement("img");
          Object.assign(newIcon.style, { position: 'absolute', top: '5px', left: '5px', width: '38px', height: '38px', zIndex: '12' });
          newIcon.src = "https://i.postimg.cc/brzkbbs0/win-card-icon-new.png";
          container.appendChild(newIcon);
        }
      }

      // Info 圖示與復刻資訊
      const infoIcon = document.createElement("img");
      infoIcon.src = "https://i.postimg.cc/FR8GhM2m/win-info.png";
      Object.assign(infoIcon.style, { position: 'absolute', top: '5px', right: '5px', width: '28px', height: '28px', cursor: 'pointer', zIndex: '10' });
      container.appendChild(infoIcon);

      const popup = document.createElement("div");
      Object.assign(popup.style, { position: 'absolute', top: '40px', right: '5px', background: 'rgba(255,255,255,0.95)', border: '1px solid #ccc', padding: '6px 10px', borderRadius: '6px', fontSize: '14px', boxShadow: '0 2px 6px rgba(0,0,0,0.2)', display: 'none', zIndex: '20' });

      let latestReturnText = "暫未復刻", returnCountText = "復刻 0 次", firstStartText = "未知";
      const returnType = tsum.returndate?.toString().toLowerCase();

      if (returnType === "permanent") {
        latestReturnText = `<span style="color:red;font-weight:bold;">常駐Tsum</span>`;
        returnCountText = "";
      } else if (returnType === "nocomeback") {
        latestReturnText = `<span style="color:red;font-weight:bold;">永不回歸</span>`;
        returnCountText = "";
      } else {
        const validReturns = Array.isArray(tsum.returndate) ? tsum.returndate.filter(x => !isNaN(x)).map(Number).sort((a,b)=>a-b) : [];
        const now = new Date();
        const filteredReturns = validReturns.filter(t => {
          const d = new Date(t * 1000);
          return !(d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth());
        });

        returnCountText = `目前已復刻 ${validReturns.length} 次`;

        if (filteredReturns.length > 0) {
          const d = new Date(filteredReturns[filteredReturns.length - 1] * 1000);
          latestReturnText = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
        } else if (validReturns.length === 1) {
          const d = new Date(validReturns[0] * 1000);
          latestReturnText = `首次復刻（${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}）`;
        }
      }

      if (!isNaN(tsum.startdate)) {
        const sd = new Date(tsum.startdate * 1000);
        firstStartText = `${sd.getFullYear()}/${(sd.getMonth()+1).toString().padStart(2,'0')}`;
      }

      popup.innerHTML = `最近復刻：${latestReturnText}<br>${returnCountText}<br>首次推出：${firstStartText}`;
      container.appendChild(popup);

      infoIcon.onclick = (e) => {
        e.stopPropagation();
        popup.style.display = popup.style.display === "none" ? "block" : "none";
      };

      // Tsum 圖片
      const img = document.createElement("img");
      img.className = "tsum-img";
      img.src = images[tsum.image] || "";
      container.appendChild(img);

      // 名稱
      const nameLine = document.createElement("div");
      nameLine.className = "name";
      nameLine.textContent = tsum.name;
      container.appendChild(nameLine);

      // 總需要花費的箱數 (滿等)
      const maxBoxes = tsum.skill_cost.reduce((a, b) => a + b, 0);

      // --- 下拉選單與進度條區塊 ---
      const dropdownWrap = document.createElement("div");
      dropdownWrap.className = "dropdown-wrap";

      const levelSelect = document.createElement("select");
      for (let i = 0; i <= tsum.skill_cost.length; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `SLv ${i}`;
        levelSelect.appendChild(option);
      }

      const progressWrap = document.createElement("div");
      progressWrap.className = "progress-wrap";

      const minusBtn = document.createElement("img");
      minusBtn.src = "https://i.postimg.cc/d1knxFtm/win-minus-on.png";
      minusBtn.style.cssText = "width:24px; height:24px; cursor:pointer; user-select:none;";

      const plusBtn = document.createElement("img");
      plusBtn.src = "https://i.postimg.cc/HkdZsFBp/win-plus-on2.png";
      plusBtn.style.cssText = "width:24px; height:24px; cursor:pointer; user-select:none;";

      // 組合進度條
      const progressBar = document.createElement("div");
      progressBar.className = "tsum-progress-bar";
      
      const baseImg = document.createElement("img");
      baseImg.src = "https://i.postimg.cc/2SX6LK0h/win-tsumlevelbar-m0.png";
      
      const fillWrap = document.createElement("div");
      fillWrap.className = "tsum-progress-fill";
      
      const fillImg = document.createElement("img");
      fillImg.src = "https://i.postimg.cc/K8sz3H0n/win-tsumskillbar-m1.png";
      fillWrap.appendChild(fillImg);
      
      const progressText = document.createElement("span");
      progressText.className = "tsum-progress-text";
      
      progressBar.append(baseImg, fillWrap, progressText);
      progressWrap.append(minusBtn, progressBar, plusBtn);
      dropdownWrap.append(levelSelect, progressWrap);
      container.appendChild(dropdownWrap);

      // --- 金幣顯示區塊 ---
      const coinLine = document.createElement("div");
      coinLine.className = "coin-line";
      const currencyIcon = document.createElement("img");
      const valueSpan = document.createElement("span");
      valueSpan.className = "gold";
      coinLine.append(currencyIcon, valueSpan);
      container.appendChild(coinLine);

      // --- 核心更新邏輯 ---
      let currentBoxes = savedBoxes[tsumId] || 0;

      function updateUIAndCost() {
        // 防止數量超過上限或小於0
        currentBoxes = Math.max(0, Math.min(currentBoxes, maxBoxes));
        savedBoxes[tsumId] = currentBoxes;
        saveBoxesToStorage();
        
        // 取得當前狀態
        const info = getLevelInfo(currentBoxes, tsum.skill_cost);
        
        // 更新下拉選單
        levelSelect.value = info.level;
        
        // 更新進度條
        fillWrap.style.width = info.isMax ? "100%" : `${info.percent}%`;
        progressText.textContent = info.isMax ? "MAX" : `${info.percent}%`;
        
        // 更新金幣: (滿等所需隻數 - 擁有隻數) * 單抽價格
        const remainingBoxes = maxBoxes - currentBoxes;
        const cost = remainingBoxes * (currentBoxType === "medal" ? MEDAL_PER_COST : GOLD_PER_COST);
        
        currencyIcon.src = currentBoxType === "medal" ? IMAGE_MEDAL : IMAGE_COIN;
        valueSpan.textContent = cost.toLocaleString();
        
        updateTotal();
      }

      // 提供給外層匯總使用的方法
      container._getGold = () => {
        return (maxBoxes - currentBoxes) * (currentBoxType === "medal" ? MEDAL_PER_COST : GOLD_PER_COST);
      }; 

      // 監聽器
      levelSelect.addEventListener("change", (e) => {
        const targetLevel = parseInt(e.target.value);
        // 若玩家從下拉選單改變，重置該等級的 % 數，變回該等級剛好達到的總隻數
        currentBoxes = tsum.skill_cost.slice(0, targetLevel).reduce((a, b) => a + b, 0);
        updateUIAndCost();
      });

      minusBtn.onclick = () => {
        currentBoxes--;
        updateUIAndCost();
      };

      plusBtn.onclick = () => {
        currentBoxes++;
        updateUIAndCost();
      };

      // 初始渲染
      updateUIAndCost(); 
      return container;
    }

    function updateTotal() {
      let total = 0;
      document.querySelectorAll(".tsum-container").forEach(c => {
        if (typeof c._getGold === 'function') total += c._getGold();
      });
      document.getElementById("totalGold").textContent = total.toLocaleString();
    }

    function renderCountdown(start, end, element, label) {
      clearInterval(element === countdownBox ? countdownInterval : rateupInterval);
      const update = () => {
        const now = Math.floor(Date.now() / 1000);
        if (now >= end) { element.textContent = label + "已結束"; return; }
        
        const isBeforeStart = now < start;
        const target = isBeforeStart ? start : end;
        const prefix = label + (isBeforeStart ? "開始於" : "結束於");
        
        const diff = target - now;
        const d = Math.floor(diff / 86400);
        const h = Math.floor((diff % 86400) / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        element.textContent = `${prefix} ${d}天 ${h}時 ${m}分 ${s}秒`;
      };
      update();
      const interval = setInterval(update, 1000);
      if (element === countdownBox) countdownInterval = interval;
      else rateupInterval = interval;
    }

    const boxSelectorWrapper = document.getElementById("boxSelectorWrapper");
    let dropdownSelectedEl, dropdownListEl;

    function createImageDropdown() {
      document.querySelector(".tsum-dropdown")?.remove();
      const dropdown = document.createElement("div");
      dropdown.className = "tsum-dropdown";
      
      dropdownSelectedEl = document.createElement("img");
      dropdownSelectedEl.className = "tsum-selected";
      
      dropdownListEl = document.createElement("div");
      dropdownListEl.className = "tsum-dropdown-list";
      
      dropdown.append(dropdownSelectedEl, dropdownListEl);
      
      dropdownSelectedEl.onclick = (e) => {
        e.stopPropagation();
        dropdownListEl.classList.toggle("show");
      };
      
      document.addEventListener("click", () => dropdownListEl.classList.remove("show"));
      boxSelectorWrapper.insertBefore(dropdown, document.getElementById("countdownArea"));
      rebuildDropdownList();
    }

    function rebuildDropdownList() {
      if (!dropdownListEl || !dropdownSelectedEl) return;
      dropdownListEl.innerHTML = "";
      let first = null;
      
      selectbox.forEach((box, index) => {
        if (box.box_label && isBoxVisible(box)) {
          const item = document.createElement("img");
          item.src = box.box_label;
          item.className = "tsum-dropdown-item";
          item.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll(".tsum-dropdown-item").forEach(el => el.classList.remove("active"));
            item.classList.add("active");
            dropdownSelectedEl.src = box.box_label;
            dropdownListEl.classList.remove("show");
            renderBox(index);
            currentIndex = index;
          };
          dropdownListEl.appendChild(item);
          if (!first) first = {box, index, item};
        }
      });
      if (first) {
        dropdownSelectedEl.src = first.box.box_label || "";
        first.item.classList.add("active");
      } else {
        dropdownSelectedEl.src = "";
      }
    }

    function renderBox(index) {
      tsumArea.innerHTML = "";
      const box = selectbox[index];
      currentBoxType = (box.box_type === "medal") ? "medal" : "gold";

      document.querySelector("#totalWrapper img").src = currentBoxType === "medal" ? IMAGE_MEDAL : IMAGE_COIN;
      if (dropdownSelectedEl) dropdownSelectedEl.src = box.box_label || "";
      
      box.box_tsum.forEach(tsumId => {
        const el = createTsumBox(tsumId);
        if (el) tsumArea.appendChild(el);
      });
      updateTotal();
      
      const toggleCountdown = (element, start, end, label, interval) => {
        if (start && end) {
          element.style.display = "block";
          renderCountdown(start, end, element, label);
        } else {
          element.style.display = "none";
          clearInterval(interval);
          element.textContent = "";
        }
      };

      toggleCountdown(countdownBox, box.startdate, box.enddate, "", countdownInterval);
      toggleCountdown(rateupCountdown, box.rateupstartdate, box.rateupenddate, "Rate Up", rateupInterval);
    }

    createImageDropdown();
    let currentIndex = selectbox.findIndex(isBoxVisible);
    if (currentIndex !== -1) renderBox(currentIndex);

    document.getElementById("resetLevels").addEventListener("click", () => {
      if (confirm("確定要重置所有技能等級與進度嗎？")) {
        localStorage.removeItem("savedBoxes");
        localStorage.removeItem("savedLevels");
        savedBoxes = {};
        currentIndex = selectbox.findIndex(isBoxVisible);
        if (currentIndex !== -1) renderBox(currentIndex);
        updateTotal();
        rebuildDropdownList();
      }
    });
    
    document.addEventListener("click", () => {
      document.querySelectorAll(".tsum-container div[style*='display: block']").forEach(p => p.style.display = 'none');
    });
  </script>
</body>
</html>
