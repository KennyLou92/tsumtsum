<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Tsum Tsum 抽卡模擬器</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #f8f8f8;
      text-align: center;
      padding: 20px;
    }
    #banner {
      width: 500px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    #drawBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    #drawBtn:hover {
      background-color: #0056b3;
    }
    #resultContainer {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .tsum {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      background-color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tsum img {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Tsum Tsum 抽卡模擬器</h1>
  <img id="banner" src="" alt="Box Banner">
  <br>
  <button id="drawBtn">抽卡！</button>

  <div id="resultContainer"></div>

  <!-- 外部載入 JS -->
  <script src="selectbox.js"></script>
  <script src="tsum.js"></script>
  <script src="images.js"></script>

  <script>
    // 🔹 每次重新整理頁面時，清除抽卡結果
    window.addEventListener("beforeunload", () => {
      localStorage.removeItem("tsumResults");
    });

    const resultContainer = document.getElementById("resultContainer");
    const drawBtn = document.getElementById("drawBtn");
    const banner = document.getElementById("banner");

    // 找 novbox
    const boxData = selectbox.find(b => b.box === "novbox");
    if (!boxData) {
      console.error("找不到 novbox");
    } else {
      banner.src = boxData.box_label;
    }

    // 讀取已保存的抽卡結果（理論上因為 beforeunload，重整後不會留著）
    const savedResults = JSON.parse(localStorage.getItem("tsumResults")) || [];
    savedResults.forEach(showTsum);

    drawBtn.addEventListener("click", () => {
      if (!boxData) return;
      const tsumId = boxData.box_tsum[Math.floor(Math.random() * boxData.box_tsum.length)];
      const tsumInfo = tsumData.find(t => t.id === tsumId);
      if (!tsumInfo) {
        console.error(`找不到 tsum id: ${tsumId}`);
        return;
      }

      const tsumImg = images[tsumInfo.image];
      if (!tsumImg) {
        console.error(`找不到圖片: ${tsumInfo.image}`);
        return;
      }

      const newResult = { id: tsumId, image: tsumImg };
      savedResults.push(newResult);
      localStorage.setItem("tsumResults", JSON.stringify(savedResults));

      showTsum(newResult);
    });

    function showTsum(result) {
      const tsumDiv = document.createElement("div");
      tsumDiv.className = "tsum";

      const img = document.createElement("img");
      img.src = result.image;
      tsumDiv.appendChild(img);

      resultContainer.appendChild(tsumDiv);
    }
  </script>
</body>
</html>
