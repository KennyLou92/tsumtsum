<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎵TsumTsum 列表</title>
  <script>
    try {
      if (localStorage.getItem("tsumTheme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --panel: #ffffff;
      --panel-hover: #fbf7ec;
      --line: #ddd6c8;
      --text: #2a2a2a;
      --muted: #777;
      --accent: #c27a00;
      --bar: rgba(246, 243, 238, 0.95);
      --input-bg: #fff;
      --input-text: #222;
      --input-line: #ccc;
      --overlay: rgba(0, 0, 0, 0.5);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #222;
      --panel: #2c2c2c;
      --panel-hover: #363636;
      --line: #4a4a4a;
      --text: #eee;
      --muted: #aaa;
      --accent: #ffd34d;
      --bar: rgba(34, 34, 34, 0.95);
      --input-bg: #fff;
      --input-text: #000;
      --input-line: #ccc;
      --overlay: rgba(0, 0, 0, 0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- 搜尋列 ---------- */
    #search-container {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    #search {
      width: 300px;
      max-width: 100%;
      padding: 10px;
      font-size: 16px;
      color: var(--input-text);
      background: var(--input-bg);
      border: 1px solid var(--input-line);
    }
    #themeBtn {
      margin-left: auto;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    #themeBtn:hover { border-color: var(--accent); }
    #themeBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #clearSearchBtn {
      width: 35px;
      height: 35px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #clearSearchBtn:hover { opacity: 1; }

    /* ---------- Tsum 方格 ---------- */
    #tsumGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      padding: 20px;
    }
    .tsum-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tsum-card:hover { background: var(--panel-hover); border-color: var(--accent); }
    .tsum-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tsum-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .tsum-card .no {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .tsum-card .name {
      margin-top: 2px;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      word-break: break-word;
    }
    .tsum-card .no-img {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
    }
    #emptyMsg {
      display: none;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- 詳細視窗 ---------- */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--overlay);
    }
    #modal.open { display: flex; }
    .modal-box {
      position: relative;
      width: 100%;
      max-width: 560px;
      max-height: 100%;
      overflow-y: auto;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--accent); }
    .modal-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-right: 30px;
    }
    .modal-head img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .modal-head .no { font-size: 13px; color: var(--muted); }
    .modal-head .name { font-size: 20px; font-weight: bold; }
    .modal-head .name-en { font-size: 13px; color: var(--muted); }

    .modal-label {
      margin: 16px 0 8px;
      text-align: center;
    }
    .modal-label img {
      max-width: 100%;
      height: 100px;
      object-fit: contain;
    }
    .modal-label .none { color: var(--muted); }

    .skill-list { margin: 0; padding: 0; list-style: none; }
    .skill-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .skill-row .lv {
      font-weight: bold;
      color: var(--accent);
    }
    .skill-row .desc { line-height: 1.5; }
    .skill-icon {
      height: 30px;
      vertical-align: middle;
    }
    .cost {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .cost img { height: 24px; }
    .skill-empty { padding: 16px 0; text-align: center; color: var(--muted); }

    /* ---------- 捲動按鈕 ---------- */
    .scroll-button {
      position: fixed;
      right: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      opacity: 0.1;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .scroll-button:hover { opacity: 1; }
    #scrollTopBtn { bottom: 80px; }
    #scrollBottomBtn { bottom: 20px; }
  </style>
</head>
<body>
  <div id="search-container">
    <input type="text" id="search" placeholder="🔍 輸入Tsum名稱..." />
    <img id="clearSearchBtn" src="https://i.postimg.cc/6pVSz87S/win-batsu-s.png" alt="Clear" />
    <button type="button" id="themeBtn"></button>
  </div>

  <div id="tsumGrid"></div>
  <div id="emptyMsg">找不到符合的 Tsum</div>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <img id="scrollTopBtn" class="scroll-button" src="https://i.postimg.cc/RZRdN8b6/win-arrow-up.png" alt="Top" />
  <img id="scrollBottomBtn" class="scroll-button" src="https://i.postimg.cc/MGpDRDhs/win-arrow-down.png" alt="Bottom" />

  <script src="tsum.js"></script>
  <script src="images.js"></script>
  <script src="skilllabel.js"></script>
  <script src="littletsum.js"></script>

  <script>
    const imageMap = images;
    const TICKET_IMG = "https://i.postimg.cc/nzcz0QBq/win-i-ticket-S.png";
    const iconMap = {};
    const grid = document.getElementById("tsumGrid");
    const emptyMsg = document.getElementById("emptyMsg");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearchBtn");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");

    (window.littletsumData || []).forEach(item => {
      const key = Object.keys(item)[0];
      iconMap[key] = item[key];
    });

    // ---------- 工具 ----------
    const esc = s => String(s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const escRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const iconKeys = Object.keys(iconMap)
      .filter(k => k && imageMap[iconMap[k]])
      .sort((a, b) => b.length - a.length);
    const iconRegex = iconKeys.length
      ? new RegExp("(" + iconKeys.map(escRegex).join("|") + ")", "g")
      : null;

    // 技能說明：文字跳脫、圖示代碼換成圖片、換行轉 <br>
    function parseDesc(raw) {
      const html = iconRegex
        ? raw.split(iconRegex).map((part, i) =>
            i % 2 === 1
              ? `<img src="${imageMap[iconMap[part]]}" class="skill-icon" alt="">`
              : esc(part)
          ).join("")
        : esc(raw);
      return html.replace(/\n/g, "<br>");
    }

    function getImageNames(tsum) {
      return Array.isArray(tsum.image)
        ? tsum.image
        : String(tsum.image || "").split(",").map(s => s.trim());
    }

    const padNo = id => String(id ?? "").padStart(3, "0");

    // ---------- 方格 ----------
    function render(data) {
      grid.innerHTML = "";
      emptyMsg.style.display = data.length ? "none" : "block";

      data.forEach(tsum => {
        const imageNames = getImageNames(tsum);
        let imageIndex = 0;

        const card = document.createElement("button");
        card.type = "button";
        card.className = "tsum-card";

        if (imageMap[imageNames[0]]) {
          const img = document.createElement("img");
          img.src = imageMap[imageNames[0]];
          img.alt = tsum.name || "";
          card.appendChild(img);

          // 多張圖：滑過時輪播
          if (imageNames.length > 1) {
            let intervalId = null;
            card.addEventListener("mouseenter", () => {
              intervalId = setInterval(() => {
                imageIndex = (imageIndex + 1) % imageNames.length;
                const next = imageMap[imageNames[imageIndex]];
                if (next) img.src = next;
              }, 500);
            });
            card.addEventListener("mouseleave", () => {
              clearInterval(intervalId);
              imageIndex = 0;
              img.src = imageMap[imageNames[0]];
            });
          }
        } else {
          const ph = document.createElement("div");
          ph.className = "no-img";
          ph.textContent = imageNames[0] || "";
          card.appendChild(ph);
        }

        const no = document.createElement("div");
        no.className = "no";
        no.textContent = "No." + padNo(tsum.id);
        card.appendChild(no);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = tsum.name || "";
        card.appendChild(name);

        card.addEventListener("click", () => openModal(tsum));
        grid.appendChild(card);
      });
    }

    // ---------- 詳細視窗 ----------
    function openModal(tsum) {
      const imageNames = getImageNames(tsum);
      const imgSrc = imageMap[imageNames[0]];
      const labelSrc = tsum.skill_label && skillLabelMap[tsum.skill_label];

      // 各等級
      let rows = "";
      for (let i = 0; i < 6; i++) {
        const desc = tsum.skill_desc?.[i] || "";
        const cost = tsum.skill_cost?.[i];
        const hasCost = cost !== undefined && cost !== null;
        if (!desc && !hasCost) continue;

        rows += `
          <li class="skill-row">
            <span class="lv">SLv${i + 1}</span>
            <span class="desc">${parseDesc(desc)}</span>
            <span class="cost">${hasCost
              ? `<img src="${TICKET_IMG}" alt="ticket">× ${esc(cost)}`
              : ""}</span>
          </li>`;
      }

      modalBox.innerHTML = `
        <button type="button" class="modal-close" aria-label="關閉">×</button>
        <div class="modal-head">
          ${imgSrc ? `<img src="${imgSrc}" alt="">` : ""}
          <div>
            <div class="no">No.${esc(padNo(tsum.id))}</div>
            <div class="name">${esc(tsum.name || "")}</div>
            ${tsum.name_en ? `<div class="name-en">${esc(tsum.name_en)}</div>` : ""}
          </div>
        </div>
        <div class="modal-label">
          ${labelSrc ? `<img src="${labelSrc}" alt="技能">` : `<span class="none">暫無</span>`}
        </div>
        ${rows
          ? `<ul class="skill-list">${rows}</ul>`
          : `<div class="skill-empty">暫無技能資料</div>`}
      `;

      modalBox.querySelector(".modal-close").addEventListener("click", closeModal);
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
      modalBox.scrollTop = 0;
    }

    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- 搜尋 ----------
    const sorted = tsumData.sort((a, b) => a.id - b.id);
    render(sorted);

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      render(sorted.filter(tsum =>
        tsum.name?.toLowerCase().includes(q) ||
        tsum.name_en?.toLowerCase().includes(q) ||
        String(tsum.id).includes(q)
      ));
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render(sorted);
      searchInput.focus();
    });

    searchInput.addEventListener("focus", () => { searchInput.placeholder = ""; });
    searchInput.addEventListener("blur", () => {
      if (!searchInput.value) searchInput.placeholder = "🔍 輸入Tsum名稱...";
    });

    // ---------- 深淺色切換 ----------
    const themeBtn = document.getElementById("themeBtn");
    const root = document.documentElement;

    function updateThemeBtn() {
      const isDark = root.getAttribute("data-theme") === "dark";
      themeBtn.textContent = isDark ? "☀️ 淺色" : "🌙 深色";
    }

    themeBtn.addEventListener("click", () => {
      const toDark = root.getAttribute("data-theme") !== "dark";
      if (toDark) root.setAttribute("data-theme", "dark");
      else root.removeAttribute("data-theme");
      try { localStorage.setItem("tsumTheme", toDark ? "dark" : "light"); } catch (e) {}
      updateThemeBtn();
    });
    updateThemeBtn();

    // ---------- 捲動按鈕 ----------
    document.getElementById("scrollTopBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("scrollBottomBtn").addEventListener("click", () => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });
  </script>
</body>
</html>
